<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Revenant">
  <defs>
    <!-- Near-black, a shade lighter at the top so the tile has a top and a
         bottom. No edge light and no glow: both drew pale rings round the
         figure at taskbar sizes. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1816"/>
      <stop offset="1" stop-color="#0a0908"/>
    </linearGradient>
  </defs>

  <style>
    /* The light and shade turn to mush below about 40px. The builder sets
       these classes on the root for the small entries in the .ico: the figure
       grows to fill more of the tile and the eye holes open wider, so they are
       still two holes after the downscale rather than one smudge. */
    .small .sheen, .small .shade, .small .tip-shade { display: none; }
    .small .figure { transform: translate(48.8px, 30.26px) scale(3.6); }
    .small .eye { rx: 4.8px; ry: 7px; }
    .tiny .eye { rx: 5.2px; ry: 7.6px; }
  </style>

  <rect width="256" height="256" rx="58" fill="url(#tile)"/>

  <!-- The revenant: a shrouded figure whose hem hangs in five points, the
       app's own drawing. The app gives it eyes that look about; here they are
       holes cut through the sheet, which is what still reads at 16px. -->
  <g class="figure" transform="translate(55.4 38.4) scale(3.3)" fill="#dd7b52">
    <path d="M4 42V21C4 10.5 12 2.5 22 2.5S40 10.5 40 21v21z"/>
    <path d="M4 41.4h7.2C10.77 45.99 7.08 48.54 6.3 50.75Q6 51.85 5.7 50.75C4.92 48.54 4.43 45.99 4 41.4z"/>
    <path d="M11.2 41.4h7.2C17.97 44.73 15.38 46.58 14.69 47.99Q14.3 49.05 13.91 47.99C13.22 46.58 11.63 44.73 11.2 41.4z"/>
    <path d="M18.4 41.4h7.2C25.17 45.54 23.28 47.84 22.53 49.76Q22.2 50.85 21.87 49.76C21.12 47.84 18.83 45.54 18.4 41.4z"/>
    <path d="M25.6 41.4h7.2C32.37 44.55 30.98 46.3 30.31 47.6Q29.9 48.65 29.49 47.6C28.82 46.3 26.03 44.55 25.6 41.4z"/>
    <path d="M32.8 41.4h7.2C39.57 45.81 39.18 48.26 38.41 50.36Q38.1 51.45 37.79 50.36C37.02 48.26 33.23 45.81 32.8 41.4z"/>
    <path class="shade" d="M30 3.6C36 7 40 13.4 40 21v21h-6V21c0-7-1.6-13.2-4-17.4z" fill="#000" opacity="0.16"/>
    <path class="tip-shade" d="M34 42H40C39.6 45.9 39.18 48.26 38.41 50.36Q38.1 51.45 37.79 50.36C37.2 46.8 34.9 43.6 34 42z" fill="#000" opacity="0.16"/>
    <path class="sheen" d="M14.6 5.2C11 8.6 9 14.2 9 21v7.5C9 30.8 7.4 32.8 6 34V21c0-6.6 3.2-12.8 8.6-15.8z" fill="#fff" opacity="0.22"/>
    <ellipse class="eye" cx="15.2" cy="21" rx="4.1" ry="6" fill="#0d0c0b"/>
    <ellipse class="eye" cx="28.8" cy="21" rx="4.1" ry="6" fill="#0d0c0b"/>
  </g>
</svg>
