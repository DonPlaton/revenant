<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Revenant">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2926"/>
      <stop offset="1" stop-color="#161513"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#eb9a7c"/>
      <stop offset="1" stop-color="#d1653f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* Shading and a halo turn to mush below about 40px, and the face closes up.
       The builder sets these classes on the root to draw a plainer figure for
       the small entries in the .ico rather than shrinking the detailed one. */
    .small .sheen, .small .shade, .small .halo { display: none; }
    .small .sclera { rx: 6.4px; ry: 6.9px; }
    .small .pupil { r: 3px; }
    .tiny .mouth { display: none; }
    .tiny .sclera { rx: 7px; ry: 7.4px; }
    .tiny .pupil { r: 3.4px; }
  </style>

  <rect width="256" height="256" rx="58" fill="url(#plate)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#3a3733" stroke-width="3"/>
  <circle class="halo" cx="128" cy="112" r="92" fill="url(#halo)"/>

  <!-- The revenant: a shrouded figure whose hem breaks into the peaks of a
       terminal caret. The app animates this same drawing. -->
  <g transform="translate(68.2 46) scale(2.72)" fill="url(#ghost)">
    <path d="M4 42V21C4 10.5 12 2.5 22 2.5S40 10.5 40 21v21z"/>
    <path d="M4 41.4h7.2L7.6 50z"/>
    <path d="M11.2 41.4h7.2L14.8 48z"/>
    <path d="M18.4 41.4h7.2L22 51z"/>
    <path d="M25.6 41.4h7.2L29.2 48z"/>
    <path d="M32.8 41.4h7.2L36.4 50z"/>
    <path class="shade" d="M30 3.6C36 7 40 13.4 40 21v21h-6V21c0-7-1.6-13.2-4-17.4z" fill="#000" opacity="0.16"/>
    <path class="sheen" d="M14.6 5.2C11 8.6 9 14.2 9 21v12H6V21c0-6.6 3.2-12.8 8.6-15.8z" fill="#fff" opacity="0.22"/>
    <ellipse class="sclera" cx="15.4" cy="21.5" rx="5.3" ry="6" fill="#f4efe6"/>
    <ellipse class="sclera" cx="29.6" cy="21.5" rx="5.3" ry="6" fill="#f4efe6"/>
    <circle class="pupil" cx="17.8" cy="22.6" r="2.5" fill="#191715"/>
    <circle class="pupil" cx="32" cy="22.6" r="2.5" fill="#191715"/>
    <ellipse class="mouth" cx="22.4" cy="33.4" rx="2.5" ry="3" fill="#191715" opacity="0.85"/>
  </g>
</svg>
