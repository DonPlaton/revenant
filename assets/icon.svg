<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Revenant">
  <defs>
    <!-- A near-black tile, domed a little toward the light, so it reads as an
         object on any wallpaper without a pattern to crowd the figure. -->
    <radialGradient id="dome" cx="0.5" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#282523"/>
      <stop offset="0.62" stop-color="#121110"/>
      <stop offset="1" stop-color="#070606"/>
    </radialGradient>
    <!-- The tile's edge: lit along the top, sunk along the bottom. -->
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.26"/>
      <stop offset="0.22" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#dd7b52" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#dd7b52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cast">
      <stop offset="0" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* Shading, the halo and the shadow turn to mush below about 40px, and the
       face closes up. The builder sets these classes on the root to draw a
       plainer figure for the small entries in the .ico rather than shrinking
       the detailed one. */
    .small .sheen, .small .shade, .small .tip-shade, .small .halo, .small .cast { display: none; }
    .small .sclera { rx: 6.4px; ry: 6.9px; }
    .small .pupil { r: 3px; }
    .tiny .mouth { display: none; }
    .tiny .sclera { rx: 7px; ry: 7.4px; }
    .tiny .pupil { r: 3.4px; }
  </style>

  <rect width="256" height="256" rx="58" fill="url(#dome)"/>
  <rect x="3.5" y="3.5" width="249" height="249" rx="54.5" fill="none" stroke="url(#bevel)" stroke-width="4"/>
  <circle class="halo" cx="128" cy="116" r="100" fill="url(#halo)"/>
  <ellipse class="cast" cx="128" cy="214" rx="66" ry="10" fill="url(#cast)"/>

  <!-- The revenant: a shrouded figure whose hem hangs in the points of a
       terminal caret, in the app's three colours. The app animates this same
       drawing. -->
  <g transform="translate(62 44) scale(3)" fill="#dd7b52">
    <path d="M4 42V21C4 10.5 12 2.5 22 2.5S40 10.5 40 21v21z"/>
    <path d="M4 41.4h7.2C10.77 45.99 7.08 48.54 6.3 50.75Q6 51.85 5.7 50.75C4.92 48.54 4.43 45.99 4 41.4z"/>
    <path d="M11.2 41.4h7.2C17.97 44.73 15.38 46.58 14.69 47.99Q14.3 49.05 13.91 47.99C13.22 46.58 11.63 44.73 11.2 41.4z"/>
    <path d="M18.4 41.4h7.2C25.17 45.54 23.28 47.84 22.53 49.76Q22.2 50.85 21.87 49.76C21.12 47.84 18.83 45.54 18.4 41.4z"/>
    <path d="M25.6 41.4h7.2C32.37 44.55 30.98 46.3 30.31 47.6Q29.9 48.65 29.49 47.6C28.82 46.3 26.03 44.55 25.6 41.4z"/>
    <path d="M32.8 41.4h7.2C39.57 45.81 39.18 48.26 38.41 50.36Q38.1 51.45 37.79 50.36C37.02 48.26 33.23 45.81 32.8 41.4z"/>
    <path class="shade" d="M30 3.6C36 7 40 13.4 40 21v21h-6V21c0-7-1.6-13.2-4-17.4z" fill="#000" opacity="0.16"/>
    <path class="tip-shade" d="M34 42H40C39.6 45.9 39.18 48.26 38.41 50.36Q38.1 51.45 37.79 50.36C37.2 46.8 34.9 43.6 34 42z" fill="#000" opacity="0.16"/>
    <path class="sheen" d="M14.6 5.2C11 8.6 9 14.2 9 21v7.5C9 30.8 7.4 32.8 6 34V21c0-6.6 3.2-12.8 8.6-15.8z" fill="#fff" opacity="0.22"/>
    <ellipse class="sclera" cx="15.4" cy="21.5" rx="5.3" ry="6" fill="#f4efe6"/>
    <ellipse class="sclera" cx="29.6" cy="21.5" rx="5.3" ry="6" fill="#f4efe6"/>
    <circle class="pupil" cx="17.8" cy="22.6" r="2.5" fill="#191715"/>
    <circle class="pupil" cx="32" cy="22.6" r="2.5" fill="#191715"/>
    <ellipse class="mouth" cx="22.4" cy="33.4" rx="2.5" ry="3" fill="#191715" opacity="0.85"/>
  </g>
</svg>
