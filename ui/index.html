<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1c1a18">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'self'">
<title>Revenant</title>
<style>
/* ── tokens ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#1c1a18; --ink:#eeeae1; --ink-2:#a9a297; --ink-3:#7a746b;
  --rule:#35322d; --rule-soft:#282521; --wash:#221f1c;
  --ember:#dd7b52; --ember-dim:rgba(221,123,82,.10); --ember-line:rgba(221,123,82,.42);
  --held:#8aa878; --codex:#79a6b8; --opencode:#b5a5cf;

  --mono:"Cascadia Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;

  --ease:cubic-bezier(.2,.8,.2,1);
}

*{box-sizing:border-box}
html,body{height:100%}
html{color-scheme:dark}
body,button{touch-action:manipulation}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:13px/1.5 var(--mono); overflow:hidden; user-select:none;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(120% 62% at 12% -12%, rgba(221,123,82,.09), transparent 60%);
}
::selection{background:var(--ember-dim);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:1px solid var(--ember);outline-offset:2px}

/* ── masthead ───────────────────────────────────────────────────────────── */
.top{
  flex:0 0 40px; display:flex; align-items:center; gap:22px;
  padding:0 14px 0 40px; border-bottom:1px solid var(--rule);
}
.wordmark{font-family:var(--serif);font-size:15px;letter-spacing:.34em;cursor:pointer}
/* A name like this one has earned a bad connection. */
.wordmark:hover{animation:gutter 820ms steps(1,end) 1}
@keyframes gutter{
  0%,100%{opacity:1}
  9%{opacity:.24}
  15%{opacity:1}
  21%{opacity:.24}
  27%{opacity:1}
  58%{opacity:.5}
  64%{opacity:1}
}
.tabs{display:flex;gap:18px;flex:0 0 auto}
.tabs button{
  position:relative;font-size:11px;letter-spacing:.1em;color:var(--ink-3);
  padding-bottom:3px;transition:color 140ms var(--ease);
}
/* The rule stops an em-tenth short so it ends under the last glyph rather than
   under the letter-space trailing it. */
.tabs button::after{content:"";position:absolute;left:0;right:.1em;bottom:0;height:1px;
  background:transparent;transition:background 140ms var(--ease)}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-current=true]{color:var(--ink)}
.tabs button[aria-current=true]::after{background:var(--ember)}
/* ── the cast ───────────────────────────────────────────────────────────── */
/* One drawing, five places. The horizontal travel is the only thing script
   touches; every part that gives the figure life is a keyframe on its own
   clock, which is what keeps it from reading as a sliding cut-out. */
.rev{display:block;height:100%;width:auto;overflow:visible;color:var(--ember)}
.rev .body,.rev .peak{fill:currentColor}
/* The hem is cloth, not feet: each point swings back from where it hangs and
   stretches as it goes, one after another, so a wave runs along it. */
.rev .peak{transform-box:fill-box;transform-origin:center top;
  animation:hem 620ms var(--ease) infinite alternate}
.rev .peak:nth-child(2){animation-delay:80ms}
.rev .peak:nth-child(3){animation-delay:160ms}
.rev .peak:nth-child(4){animation-delay:240ms}
.rev .peak:nth-child(5){animation-delay:320ms}
@keyframes hem{from{transform:skewX(-4deg) scaleY(.9)}to{transform:skewX(14deg) scaleY(1.12)}}
.rev .shade,.rev .tip-shade{fill:#000;opacity:.16}
/* The shade runs on into the last point, and swings with it. */
.rev .tip-shade{transform-box:view-box;transform-origin:36.4px 41.4px;
  animation:hem 620ms var(--ease) 320ms infinite alternate}
.rev .sheen{fill:#fff;opacity:.22}
.rev .sclera{fill:#f4efe6}
.rev .pupil{fill:#191715}
.rev .eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.4s step-end infinite}
@keyframes blink{0%,92%{transform:scaleY(1)}94%,97%{transform:scaleY(.12)}98%,100%{transform:scaleY(1)}}
.rev .mouth{fill:#191715;opacity:.85;transform-box:fill-box;transform-origin:center;
  animation:gasp 900ms var(--ease) infinite alternate}
@keyframes gasp{from{transform:scale(1)}to{transform:scale(.7,1.25)}}
.rev .streak{stroke:currentColor;stroke-linecap:round;fill:none;
  transform-box:fill-box;transform-origin:left center;animation:streak 520ms linear infinite}
.rev .streak:nth-of-type(2){animation-delay:170ms}
.rev .streak:nth-of-type(3){animation-delay:340ms}
@keyframes streak{
  0%{transform:translateX(-5px) scaleX(.45);opacity:.72}
  100%{transform:translateX(8px) scaleX(1.35);opacity:0}
}

/* The pursuer is a block cursor with bracket jaws, hinged at its trailing edge. */
.pur{display:block;height:100%;width:auto;overflow:visible;color:var(--codex)}
.pur .jaw{fill:currentColor;transform-box:view-box}
.pur .up{transform-origin:35px 20px;animation:bite 210ms var(--ease) infinite alternate}
.pur .lo{transform-origin:35px 20px;animation:bite-lo 210ms var(--ease) infinite alternate}
@keyframes bite{from{transform:rotate(1deg)}to{transform:rotate(15deg)}}
@keyframes bite-lo{from{transform:rotate(-1deg)}to{transform:rotate(-15deg)}}
.pur .gloss{fill:#fff;opacity:.22}
.pur .eye{fill:#15211f}
.pur .wake{stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;
  animation:wake 460ms linear infinite}
.pur .wake:nth-of-type(2){animation-delay:230ms}
@keyframes wake{0%{transform:translateX(0);opacity:.45}100%{transform:translateX(11px);opacity:0}}

/* The empty stretch of the masthead. It drags the window, and now and then
   something runs across it. */
.lane{flex:1;position:relative;height:100%;overflow:hidden}
.runner,.hunter,.crumb{position:absolute;pointer-events:none}
.runner{top:8px;left:0;height:24px}
.hunter{top:9px;left:0;height:22px}
.crumb{top:19px;width:3px;height:3px;background:var(--ink-3);
  animation:drop 180ms var(--ease) backwards}
@keyframes drop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
/* Transform and opacity only, so a swallowed crumb never repaints. */
.crumb.gone{background:var(--codex);animation:swallow 200ms var(--ease) forwards}
@keyframes swallow{to{transform:scale(2.4);opacity:0}}
/* Whoever swallowed it flashes its own colour. */
.crumb.gone.warm{background:var(--ember)}
/* Chasing rather than fled: the pupils come forward off the back wall of the eye. */
.runner.ahead .pupil{transform:translateX(-4.6px)}
/* The pair travel the other way round in the combined view. */
.runner.rightward,.hunter.rightward{transform-origin:center}
.runner.rightward .rev,.hunter.rightward .pur{transform:scaleX(-1)}
.lane .spark{top:16px}
.chrome{display:flex;gap:6px}
.chrome button{width:30px;height:24px;display:grid;place-items:center;color:var(--ink-3);
  transition:color 140ms var(--ease),background 140ms var(--ease)}
.chrome button:hover{color:var(--ink);background:var(--wash)}
.chrome button.shut:hover{background:#7d3f2c;color:#fff}

/* ── statement ──────────────────────────────────────────────────────────── */
.head{flex:0 0 auto;padding:20px 40px 0}
.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--ink-3);margin:0 0 11px}
.claim{font-family:var(--serif);font-size:28px;line-height:1.14;margin:0;font-weight:400}
.claim[data-typing=true]::after{content:"";display:inline-block;width:.42em;height:.82em;
  margin-left:.1em;vertical-align:-.05em;background:var(--ember);
  animation:pulse 1s steps(1,end) infinite}
@keyframes pulse{0%,55%{opacity:1}56%,100%{opacity:0}}
.where{margin:9px 0 0;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}

/* ── the ruler ──────────────────────────────────────────────────────────── */
.ruler{flex:0 0 auto;padding:18px 40px 0}
.ruler-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
.ruler-top span:first-child{font-size:10px;letter-spacing:.2em;color:var(--ink-3)}
.span{font-family:var(--serif);font-size:16px}
.track{position:relative;height:26px}
.track .line{position:absolute;left:0;right:0;top:9px;height:1px;background:var(--rule)}
.track .lit{position:absolute;left:0;top:9px;height:1px;background:var(--ember);
  transition:width 220ms var(--ease)}
.track .ticks{position:absolute;left:0;right:0;top:4px;height:11px}
/* Every mark on this track reads its position from the same fraction the caret
   uses, so a tick and the caret that lands on it agree to the pixel. */
.track .ticks i{position:absolute;top:0;height:11px;margin-left:-.5px;
  border-left:1px solid var(--rule)}
.track .caret{position:absolute;top:0;width:3px;height:19px;margin-left:-1.5px;background:var(--ember);
  transition:left 220ms var(--ease)}
input[type=range]{position:relative;width:100%;height:26px;margin:0;background:none;cursor:ew-resize;
  -webkit-appearance:none;appearance:none;opacity:0}
/* A wide thumb would inset its own travel by half its width at each end and
   drift away from the caret. A hairline thumb travels the full track. */
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1px;height:26px}
input[type=range]::-moz-range-thumb{width:1px;height:26px;border:0}
.track:focus-within .line{background:var(--ember)}
.track:focus-within .caret{outline:1px solid var(--ember);outline-offset:2px}
.spark{position:absolute;top:7px;width:2px;height:2px;background:var(--ember);
  pointer-events:none;animation:spark 620ms var(--ease) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.marks{position:relative;height:17px;font-size:10px;letter-spacing:.08em;color:var(--ink-3);
  margin-top:3px}
.marks button{position:absolute;top:0;font:inherit;color:var(--ink-3);cursor:pointer;
  transition:color 140ms var(--ease);white-space:nowrap;padding:2px 0}
.marks button:hover{color:var(--ink-2)}
.marks button[data-on=true]{color:var(--ember)}

/* ── the register ───────────────────────────────────────────────────────── */
.register{
  flex:1;min-height:0;margin:16px 40px 0;border-top:1px solid var(--rule);
  overflow-y:auto;overflow-x:hidden;position:relative;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
  /* Painted as a local background so the axis runs the whole scroll height
     rather than the height of the window. */
  background:linear-gradient(var(--rule),var(--rule)) 74px 0/1px 100% no-repeat local;
}
.register::-webkit-scrollbar{width:8px}
.register::-webkit-scrollbar-thumb{background:var(--rule)}
/* Rows dissolve into the bar instead of being sheared off by it, and only while
   there is something below to scroll to. */
.register[data-more=true]{
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 34px),transparent);
          mask-image:linear-gradient(180deg,#000 calc(100% - 34px),transparent);
}

.row{
  cursor:pointer;text-align:left;
  position:relative;width:100%;display:grid;
  grid-template-columns:62px 24px minmax(0,1fr) 58px;align-items:start;
  padding:10px 0 11px;border-bottom:1px solid var(--rule-soft);
  transition:background 140ms var(--ease);
  content-visibility:auto;contain-intrinsic-size:auto 74px;
}
.row:hover:not([data-held=true]){background:linear-gradient(90deg,rgba(255,255,255,.03),transparent 40%)}
.row[data-on=true]{background:linear-gradient(90deg,var(--ember-dim),transparent 45%)}
.row[data-held=true]{opacity:.5;cursor:default}
.row.enter{animation:strike 260ms var(--ease) backwards}
@keyframes strike{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}

.age{text-align:right;padding-right:14px;font-size:11px;color:var(--ink-2)}
.row[data-held=true] .age{color:var(--ink-3)}
.mark{display:flex;justify-content:center;padding-top:3px}
.mark i{width:9px;height:9px;border:1px solid var(--ink-3);
  transition:background 140ms var(--ease),border-color 140ms var(--ease)}
.row[data-on=true] .mark i{background:var(--ember);border-color:var(--ember)}
.row[data-held=true] .mark i{border-color:var(--held);
  background:repeating-linear-gradient(45deg,var(--held) 0 1px,transparent 1px 3px)}

.body{padding-left:16px;min-width:0}
.name-line{display:flex;align-items:baseline;gap:11px}
.name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:9.5px;letter-spacing:.18em;color:var(--ink-3);flex:0 0 auto}
.who[data-agent=codex]{color:var(--codex)}
.who[data-agent=opencode]{color:var(--opencode)}
.flag{font-size:9.5px;letter-spacing:.18em;color:var(--held);flex:0 0 auto;white-space:nowrap}
.path{display:block;font-size:10.5px;color:var(--ink-3);margin-top:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.row:hover .path{color:var(--ink-2)}
.path-line{display:flex;align-items:baseline;gap:10px;min-width:0}
.path-line .path{flex:1;min-width:0;user-select:text}
.copy-path{flex:0 0 auto;font-size:10px;color:var(--ink-2);padding:2px 4px}
.copy-path:hover{color:var(--ember)}
.said{font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.4;color:var(--ink-2);
  margin-top:5px;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.turns{text-align:right;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* the sweep that runs down the register while sessions are being raised */
.sweep{position:absolute;left:0;right:0;top:0;height:38px;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,transparent,rgba(221,123,82,.20) 70%,var(--ember) 98%,transparent)}
.register.raising .sweep{opacity:1;animation:sweep 900ms steps(12,end) 1 forwards}
@keyframes sweep{from{transform:translateY(-38px)}to{transform:translateY(560px)}}
.soul{position:absolute;right:64px;top:12px;height:16px;pointer-events:none;
  animation:ascend 1.5s var(--ease) forwards}
@keyframes ascend{
  0%{opacity:0;transform:translateY(8px) scale(.55)}
  22%{opacity:.95}
  100%{opacity:0;transform:translateY(-52px) scale(1.1)}
}
/* The stamp lands where the turn count sits, so the count steps aside for it. */
.row:has(.stamp) .turns{opacity:0;transition:opacity 120ms var(--ease)}
.stamp{position:absolute;right:2px;top:11px;font-family:var(--serif);font-size:11px;
  letter-spacing:.22em;color:var(--ember);border:1px solid var(--ember);padding:2px 7px;
  transform:rotate(-8deg);animation:stamp 300ms var(--ease) both}
@keyframes stamp{from{opacity:0;transform:scale(1.5) rotate(-8deg)}
                 to{opacity:1;transform:scale(1) rotate(-8deg)}}

/* ── the shuffle ────────────────────────────────────────────────────────── */
/* Laid over the register while a large revival is dealt. Everything here is
   prefixed sh-: the page already styles .bar, .name and .body globally. */
/* The stage takes the clicks meant for the rows under it: marking a row nobody
   can see would change a revival already under way. */
.sh-stage{position:fixed;z-index:8;overflow:hidden;cursor:default}
.sh-veil{position:absolute;inset:0;
  background:radial-gradient(110% 90% at var(--gx,26%) 52%,rgba(28,26,24,.95),rgba(28,26,24,.88))}
.sh-floor{position:absolute;left:8%;width:40%;height:1px;
  background:linear-gradient(90deg,transparent,var(--rule) 25%,var(--rule) 75%,transparent)}
.sh-scene,.sh-ghost,.sh-card,.sh-win,.sh-mini{position:absolute;left:0;top:0}
.sh-scene{transform-origin:0 0}
.sh-ghost{transform-origin:50% 86%;z-index:40}
.sh-ghost svg{display:block;width:100%;height:100%;overflow:visible;color:var(--ember)}
.sh-ghost .body,.sh-ghost .peak{fill:currentColor}
.sh-ghost .shade,.sh-ghost .tip-shade{fill:#000;opacity:.16}
.sh-ghost .sheen{fill:#fff;opacity:.22}
.sh-ghost .sclera{fill:#f4efe6}
.sh-ghost .pupil{fill:#191715}
.sh-ghost .eyes{transform-box:fill-box;transform-origin:center}
.sh-o{fill:#191715}
.sh-line{fill:none;stroke:#191715;stroke-width:1.5;stroke-linecap:round}
/* The grave mist it rises out of: textures drawn once, then only moved and
   faded, each on a layer of its own so a frame repaints none of them. */
.sh-mist,.sh-ember{position:absolute;left:0;top:0;opacity:0;pointer-events:none;will-change:transform,opacity}
.sh-mist{background-size:100% 100%}
.sh-mist.sh-near{z-index:45}
/* The ground it comes out of: darker under the floor line where the mist lies. */
.sh-earth{position:absolute;left:0;top:0;width:380px;height:70px;opacity:0;pointer-events:none;
  background:radial-gradient(50% 100% at 50% 0,rgba(0,0,0,.34),rgba(0,0,0,0))}
.sh-ember{width:280px;height:150px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(221,123,82,.72),rgba(221,123,82,.24) 50%,rgba(221,123,82,0))}
/* Soft contact shadows: a radial fall-off, no filter to redraw every frame. */
.sh-shadow,.sh-cast{position:absolute;left:0;top:0;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0))}
.sh-shadow{width:96px;height:14px}
.sh-cast{width:68px;height:10px}
.sh-note{position:absolute;left:0;top:0;z-index:80;font:400 17px/1 var(--serif);color:var(--ember);opacity:0}
.sh-tick{position:absolute;left:0;top:0;z-index:75;width:8px;height:1.5px;border-radius:1px;
  background:var(--ink-2);opacity:0;transform-origin:50% 50%}
.sh-bliss path,.sh-sleep path{fill:none;stroke:#191715;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* A card is a terminal seen from across the room: a lit screen in a bezel. */
.sh-card{border-radius:4px;background:#24201c;border:1px solid rgba(238,234,225,.28);overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 20px -12px rgba(0,0,0,.85)}
/* Before it unfolds, a card is the mark it was lifted from. */
.sh-seed{position:absolute;inset:0;background:var(--accent);z-index:2}
/* A card's screen wakes up in flight, in its agent's colour. */
.sh-boot{position:absolute;inset:0;z-index:1;opacity:0;
  background:linear-gradient(180deg,var(--accent),transparent 70%)}
.sh-card .sh-bar{position:absolute;left:0;right:0;top:0;height:12px;background:#2e2925;
  border-bottom:1px solid rgba(238,234,225,.1)}
.sh-dot{position:absolute;left:6px;top:4px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.sh-card .sh-prompt{position:absolute;left:6px;top:17px;font:700 10px/1 var(--mono);color:var(--accent)}
.sh-ln{position:absolute;left:6px;height:2px;border-radius:1px;background:rgba(238,234,225,.26)}
.sh-ln-a{top:32px;width:40px}
.sh-ln-b{top:39px;width:26px}

/* one window, many tabs */
.sh-win{border-radius:6px;background:#1a1715;border:1px solid rgba(238,234,225,.24);overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 24px 50px -26px rgba(0,0,0,.95)}
.sh-strip{position:absolute;left:0;right:0;top:0;height:26px;background:#24201c;
  border-bottom:1px solid rgba(238,234,225,.12)}
/* An empty slot is drawn the way the infographic draws a dead terminal:
   dashed and hatched. It turns solid when its card lands. */
.sh-tab,.sh-hole{position:absolute;border:1px dashed #4a3229;
  background:repeating-linear-gradient(135deg,#241f1d 0 4px,#1d1917 4px 8px)}
.sh-tab{top:6px;height:20px;border-radius:3px 3px 0 0;border-bottom:0}
.sh-tab.sh-live{background:#2e2925;border:1px solid rgba(238,234,225,.12);border-bottom:0}
.sh-tab:not(.sh-live) i{opacity:0}
.sh-hole{left:0;top:0;border-radius:5px}
/* Where the real window will open: drawn at its size and nearly its black, so
   the window that comes up takes its place. It grows from its corner, which is
   what the window is placed by. */
.sh-win.sh-real{transform-origin:0 0;border-radius:8px;background:#0e0d0c}
.sh-real .sh-strip{background:#1c1a18}
.sh-real .sh-tab i{top:calc(50% - 2.5px);left:10px;margin-left:0}
.sh-title{position:absolute;left:21px;right:6px;top:50%;transform:translateY(-50%);
  font:500 10px/1.2 var(--mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-tab:not(.sh-live) .sh-title{opacity:.45}
.sh-more{position:absolute;font:600 11px/1 var(--mono);color:var(--ink-2);white-space:nowrap}
/* A tab lights in its card's colour as the card lands in it. */
.sh-glow{position:absolute;inset:0;border-radius:inherit;background:var(--accent);opacity:0}
.sh-tab i{position:absolute;left:50%;top:7px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;
  background:var(--accent)}
.sh-tab.sh-on{background:#1a1715;border-color:rgba(238,234,225,.3);box-shadow:inset 0 2px 0 var(--accent)}
.sh-screen{position:absolute;left:14px;top:40px;right:14px;font:500 12px/1.6 var(--mono);color:var(--ink-2);
  white-space:pre}
.sh-screen b{color:var(--accent);font-weight:700}
.sh-said{display:inline-block;margin-top:4px;color:var(--ink-3);opacity:0}
.sh-screen .sh-cursor{display:inline-block;width:7px;height:13px;background:var(--accent);
  vertical-align:-2px;margin-left:2px}

/* many windows */
.sh-mini{border-radius:5px;background:#1a1715;border:1px solid rgba(238,234,225,.24);overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 28px -16px rgba(0,0,0,.95)}
.sh-mini .sh-bar{position:absolute;left:0;right:0;top:0;height:16px;background:#24201c;
  border-bottom:1px solid rgba(238,234,225,.1)}
.sh-name{position:absolute;left:7px;right:7px;top:3px;font:500 8.5px/1.1 var(--mono);color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.sh-mini .sh-prompt{position:absolute;left:7px;top:26px;font:700 11px/1 var(--mono);color:var(--accent)}
.sh-mini .sh-cursor{position:absolute;left:19px;top:26px;width:6px;height:11px;background:var(--accent)}

/* ── states ─────────────────────────────────────────────────────────────── */
.blank{padding:56px 0 0 110px;max-width:52ch}
.blank{position:relative}
.blank .pale{display:block;height:44px;margin:0 0 18px;color:var(--ember);opacity:.46;
  animation:hover 5.5s ease-in-out infinite alternate}
.blank .pale .streak{display:none}
.blank .pale .mouth{animation:none}
/* Standing still on a page left open, so the hem idles rather than races, and
   hangs straight rather than trailing. */
.blank .pale .peak,.blank .pale .tip-shade{animation-name:idle-hem;animation-duration:2.4s;animation-timing-function:ease-in-out}
@keyframes idle-hem{from{transform:skewX(-6deg)}to{transform:skewX(6deg) scaleY(1.06)}}
@keyframes hover{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.mote{position:absolute;width:2.5px;height:2.5px;border-radius:50%;background:var(--ember);
  opacity:0;animation:rise 7s linear infinite}
@keyframes rise{
  0%{opacity:0;transform:translateY(0)}
  14%{opacity:.6}
  70%{opacity:.34}
  100%{opacity:0;transform:translateY(-96px)}
}
.blank p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink-2);
  text-wrap:pretty}
.blank small{display:block;margin-top:13px;font-family:var(--mono);font-size:11.5px;line-height:1.8;
  color:var(--ink-3)}
.ghost-rule{height:74px;border-bottom:1px solid var(--rule-soft)}
.loading .row{opacity:.35}

/* ── action bar ─────────────────────────────────────────────────────────── */
.bar{position:relative;flex:0 0 auto;display:flex;align-items:center;
  height:64px;padding:0 40px;border-top:1px solid var(--rule)}
/* One line, always. The count truncates before the bar is allowed to grow a
   second row and shove the register up. */
.tally{flex:1;min-width:0;font-size:12px;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tally b{color:var(--ink);font-weight:500}
.hint{color:var(--ink-3)}
@media (max-width:1230px){.hint{display:none}}
.plain{flex:0 0 auto;margin-left:20px;font-size:11.5px;color:var(--ink-2);
  border-bottom:1px solid var(--rule);padding-bottom:1px;
  transition:color 140ms var(--ease),border-color 140ms var(--ease)}
.plain:hover{color:var(--ink);border-bottom-color:var(--ember)}
.mode{display:flex;align-items:baseline;gap:10px;flex:0 0 auto;margin-left:34px}
.mode-label{font-size:10px;letter-spacing:.16em;color:var(--ink-3);white-space:nowrap}
/* The masthead marks the live tab with a lit hairline and the ruler lights the
   span you picked. A third box would have been a fourth idiom, so the switch
   borrows the same one. */
.segs{display:flex;border-bottom:1px solid var(--rule)}
.seg{position:relative;font-size:11px;letter-spacing:.05em;color:var(--ink-3);
  padding:3px 9px 5px;white-space:nowrap;transition:color 140ms var(--ease)}
.seg::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:transparent;transition:background 160ms var(--ease)}
.seg:hover{color:var(--ink-2)}
.seg[aria-pressed=true]{color:var(--ink)}
/* A choice this machine's terminal cannot make: still there, visibly lesser,
   with the reason in its title and in the toast when it is picked. */
.seg[data-demoted=true]{opacity:.55}
.seg[aria-pressed=true]::after{background:var(--ember)}
@media (max-width:820px){.mode-label{display:none}}
.raise{
  flex:0 0 auto;margin-left:24px;min-width:152px;text-align:center;text-indent:.26em;
  background:var(--ember);color:#1c1a18;padding:11px 26px;font-size:12px;letter-spacing:.26em;
  font-weight:500;transition:background 140ms var(--ease),transform 90ms var(--ease);
}
.raise:hover:not(:disabled){background:#e88f68}
.raise:active:not(:disabled){transform:translateY(1px)}
.raise:disabled{background:transparent;color:var(--ink-3);border:1px solid var(--rule);
  padding:10px 25px;cursor:not-allowed}
.raise[data-busy=true]{background:transparent;color:var(--ember);border:1px solid var(--ember);
  padding:10px 25px}

/* ── word back from the app ─────────────────────────────────────────────── */
.said-back{position:absolute;left:40px;right:40px;bottom:calc(100% + 10px);z-index:9;
  font-size:11.5px;color:var(--ink-2);border-left:2px solid var(--ember);padding:7px 12px;
  background:var(--wash);opacity:0;transform:translateY(6px);pointer-events:none;
  transition:opacity 200ms var(--ease),transform 200ms var(--ease)}
.said-back.up{opacity:1;transform:none}
.said-back.bad{border-left-color:#b4553a;color:#e8b6a4}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
                       transition-duration:.01ms!important}
}
html[data-still] .row{animation:none}
html[data-still] .sweep{display:none}
/* A recorded frame is drawn at one moment, and a screenshot's clock does not run
   CSS animations or transitions, so everything is shown at rest. The deal itself
   is drawn by script and is unaffected. */
html[data-frame] *,html[data-frame] *::before,html[data-frame] *::after{animation:none!important;
  transition:none!important}
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;height:100%">

  <div class="top">
    <span class="wordmark" id="wordmark" title="Give them a run">REVENANT</span>
    <div class="tabs" id="tabs"></div>
    <span class="lane pywebview-drag-region" id="lane" aria-hidden="true"></span>
    <div class="chrome">
      <button id="hide" title="Minimize" aria-label="Minimize">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true"><path d="M1 5.5h9" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="shut" class="shut" title="Close" aria-label="Close">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true"><path d="M1.5 1.5l8 8M9.5 1.5l-8 8" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </div>
  </div>

  <div class="head">
    <p class="eyebrow">REGISTER OF THE UNFINISHED</p>
    <h1 class="claim" id="claim">Reading the register…</h1>
    <p class="where" id="where"></p>
  </div>

  <div class="ruler">
    <div class="ruler-top"><span>LOOKING BACK</span><span class="span" id="span">seven days</span></div>
    <div class="track">
      <span class="line"></span>
      <span class="lit" id="lit"></span>
      <span class="ticks" id="ticks" aria-hidden="true"></span>
      <span class="caret" id="caret"></span>
      <input type="range" id="range" min="0" max="7" step="1" value="3"
             aria-label="How far back to look" aria-valuetext="seven days">
    </div>
    <div class="marks" id="marks"></div>
  </div>

  <div class="register" id="register">
    <span class="sweep"></span>
    <div id="rows"></div>
  </div>

  <div class="bar">
    <span class="tally" id="tally"></span>
    <button class="plain" id="markall">mark all</button>
    <button class="plain" id="copy">copy commands</button>
    <div class="mode">
      <span class="mode-label">BACK INTO</span>
      <div class="segs" id="segs" role="group" aria-label="Where the sessions open">
        <button type="button" class="seg" data-layout="tabs" aria-pressed="true"
                title="Every session as a tab of one window">one window</button>
        <button type="button" class="seg" data-layout="windows" aria-pressed="false"
                title="Every session in a window of its own">separate windows</button>
      </div>
    </div>
    <button class="raise" id="raise" disabled>REVIVE</button>
    <div class="said-back" id="word" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const params = new URLSearchParams(location.search);
  const TOKEN = params.get("t") || "";
  if (params.get("still")) document.documentElement.dataset.still = "1";
  const PRESET = params.get("days");
  // For the README's recording of the deal (assets/src/build.py deal): the page
  // deals the rows it has marked and draws the scene frozen at this moment of
  // scene time. It only ever draws: nothing is sent to the service.
  const FRAME = params.get("frame");
  if (FRAME !== null) document.documentElement.dataset.frame = "1";

  const STOPS = [
    { days: 0.25, mark: "6h", said: "six hours" },
    { days: 1, mark: "1d", said: "one day" },
    { days: 3, mark: "3d", said: "three days" },
    { days: 7, mark: "7d", said: "seven days" },
    { days: 14, mark: "14d", said: "two weeks" },
    { days: 30, mark: "30d", said: "one month" },
    { days: 90, mark: "90d", said: "three months" },
    { days: 36500, mark: "all", said: "everything on disk" },
  ];
  const WORDS = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine",
                 "Ten", "Eleven", "Twelve"];

  const $ = (id) => document.getElementById(id);
  const el = {
    range: $("range"), lit: $("lit"), caret: $("caret"), ticks: $("ticks"), marks: $("marks"),
    span: $("span"), rows: $("rows"), register: $("register"), claim: $("claim"), where: $("where"),
    tally: $("tally"), raise: $("raise"), word: $("word"), tabs: $("tabs"), segs: $("segs"),
  };

  // The body and hem of assets/icon.svg, with the parts the stylesheet animates
  // split out. The icon cuts its eyes through the sheet; here they are drawn,
  // and the pupils sit back and to the right, so it watches what follows it.
  // The streaks are motion rather than identity and stay out of the icon.
  const FIGURE = `<svg class="rev" viewBox="0 0 58 58" aria-hidden="true">
      <g>
        <path class="streak" d="M41 16h8" stroke-width="3"/>
        <path class="streak" d="M42 26h10" stroke-width="3.4"/>
        <path class="streak" d="M41 34h7" stroke-width="2.6"/>
      </g>
      <path class="body" d="M4 42V21C4 10.5 12 2.5 22 2.5S40 10.5 40 21v21z"/>
      <g><path class="peak" d="M4 41.4h7.2C10.77 45.99 7.08 48.54 6.3 50.75Q6 51.85 5.7 50.75C4.92 48.54 4.43 45.99 4 41.4z"/><path class="peak" d="M11.2 41.4h7.2C17.97 44.73 15.38 46.58 14.69 47.99Q14.3 49.05 13.91 47.99C13.22 46.58 11.63 44.73 11.2 41.4z"/><path class="peak" d="M18.4 41.4h7.2C25.17 45.54 23.28 47.84 22.53 49.76Q22.2 50.85 21.87 49.76C21.12 47.84 18.83 45.54 18.4 41.4z"/><path class="peak" d="M25.6 41.4h7.2C32.37 44.55 30.98 46.3 30.31 47.6Q29.9 48.65 29.49 47.6C28.82 46.3 26.03 44.55 25.6 41.4z"/><path class="peak" d="M32.8 41.4h7.2C39.57 45.81 39.18 48.26 38.41 50.36Q38.1 51.45 37.79 50.36C37.02 48.26 33.23 45.81 32.8 41.4z"/><path class="tip-shade" d="M34 42H40C39.6 45.9 39.18 48.26 38.41 50.36Q38.1 51.45 37.79 50.36C37.2 46.8 34.9 43.6 34 42z"/></g>
      <path class="shade" d="M30 3.6C36 7 40 13.4 40 21v21h-6V21c0-7-1.6-13.2-4-17.4z"/>
      <path class="sheen" d="M14.6 5.2C11 8.6 9 14.2 9 21v7.5C9 30.8 7.4 32.8 6 34V21c0-6.6 3.2-12.8 8.6-15.8z"/>
      <g class="eyes">
        <ellipse class="sclera" cx="15.4" cy="21.5" rx="5.3" ry="6"/>
        <ellipse class="sclera" cx="29.6" cy="21.5" rx="5.3" ry="6"/>
        <circle class="pupil" cx="17.8" cy="22.6" r="2.5"/>
        <circle class="pupil" cx="32" cy="22.6" r="2.5"/>
      </g>
      <ellipse class="mouth" cx="22.4" cy="33.4" rx="2.5" ry="3"/>
    </svg>`;

  // A block cursor with bracket jaws. The hem of the figure it chases is a
  // caret too, so the pair belongs to the same alphabet.
  const HUNTER = `<svg class="pur" viewBox="0 0 52 40" aria-hidden="true">
      <path class="wake" d="M41 13c3.4 3.2 3.4 5.6 0 8.8"/>
      <path class="wake" d="M41 13c3.4 3.2 3.4 5.6 0 8.8"/>
      <g class="jaw up">
        <path d="M10 4h22a4 4 0 0 1 4 4v12H6V8a4 4 0 0 1 4-4z"/>
        <rect class="gloss" x="9.6" y="6.6" width="9" height="2.4" rx="1.2"/>
        <circle class="eye" cx="26.5" cy="12" r="2.5"/>
      </g>
      <g class="jaw lo">
        <path d="M6 20h30v12a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z"/>
        <rect class="gloss" x="9.6" y="30.4" width="6.4" height="2.2" rx="1.1" style="opacity:.14"/>
      </g>
    </svg>`;

  // The shuffling figure is the masthead's own drawing in its three colours,
  // so it cannot drift from it. The speed lines come off, since it is standing
  // still. The face is grouped so it can lag the head, a shut pair of eyes goes
  // in for the open ones to swap with, and the mouth becomes a line that can
  // round into an O and bend into a smile. The root class changes too, so the
  // masthead's blink and gasp leave these parts alone.
  const SHUFFLE_FIGURE = FIGURE
    .replace('class="rev"', 'class="sh-figure"')
    .replace(/<g>\s*<path class="streak"[\s\S]*?<\/g>/, "")
    .replace('<g class="eyes">', '<g class="sh-face"><g class="eyes">')
    .replace(/<ellipse class="mouth"[^>]*\/>/,
      '<g class="sh-bliss" style="display:none"><path d="M11.2 23.4 15.4 19.4 19.6 23.4"/>' +
      '<path d="M25.4 23.4 29.6 19.4 33.8 23.4"/></g>' +
      '<g class="sh-sleep" style="display:none"><path d="M11.4 21.6Q15.4 24.6 19.4 21.6"/>' +
      '<path d="M25.6 21.6Q29.6 24.6 33.6 21.6"/></g>' +
      '<ellipse class="sh-o" cx="22.5" cy="33.4" rx="0" ry="0"/><path class="sh-line"/></g>');

  const MOTES = [...Array(7)].map((unused, i) =>
    `<i class="mote" style="left:${96 + i * 27}px;top:${34 + (i % 4) * 15}px;` +
    `animation-delay:${i * 900}ms"></i>`).join("");

  // Every flourish in here is decoration, so all of them defer to the same two
  // conditions: a screenshot in progress, or a reader who asked for less motion.
  // One live query object rather than a new one per call; it keeps reporting the
  // current setting, so a reader who turns motion down mid-session is heard.
  const calm = matchMedia("(prefers-reduced-motion: reduce)");
  const stillness = () => Boolean(document.documentElement.dataset.still) || calm.matches;

  let typed = false;
  let sessions = [];
  let chosen = new Set();
  let agent = "";
  let seq = 0;

  // ── where the sessions land ───────────────────────────────────────────
  const LAYOUTS = ["tabs", "windows"];
  const LAYOUT_KEY = "revenant.layout";
  // Reading storage throws outright in a browser set to block site data, and the
  // app has to open anyway, so a failure here just means the default.
  const kept = (() => {
    try { return localStorage.getItem(LAYOUT_KEY); } catch (e) { return null; }
  })();
  let layout = LAYOUTS.includes(kept) ? kept : "tabs";

  // What each choice really opens on this machine, as the service reports it:
  // a console with no tabs opens windows whatever the switch says, and the
  // switch and the deal should both say so rather than promise tabs.
  let opens = {};
  const drawn = (which) => (opens[which] && opens[which].opens) || which;
  function paintMode() {
    for (const node of el.segs.children) {
      node.setAttribute("aria-pressed", String(node.dataset.layout === layout));
      if (node.dataset.plain === undefined) node.dataset.plain = node.title;
      const info = opens[node.dataset.layout];
      const short = Boolean(info && info.opens !== node.dataset.layout);
      node.dataset.demoted = String(short);
      node.title = short ? info.note : node.dataset.plain;
    }
  }
  el.segs.addEventListener("click", (event) => {
    const node = event.target.closest("[data-layout]");
    if (!node || node.dataset.layout === layout) return;
    layout = node.dataset.layout;
    try { localStorage.setItem(LAYOUT_KEY, layout); } catch (e) { /* not worth a word */ }
    paintMode();
    const info = opens[layout];
    if (info && info.opens !== layout) return word(info.note);
    word(layout === "tabs"
      ? "They will come back as tabs of one window."
      : "They will come back in windows of their own.");
  });
  paintMode();

  // ── the run ───────────────────────────────────────────────────────────
  // Crumbs fall where the runner has been, and the shape behind it is close
  // enough to reach each one a moment later.
  const lane = $("lane");
  let generation = 0;

  // Each tab gets its own run. `lead` is whoever is being chased; `meet` replaces
  // the chase entirely with an approach from both ends.
  const RUNS = {
    "claude-code": { lead: "runner", trail: "hunter", warm: false },
    codex: { lead: "hunter", trail: "runner", warm: true },
    opencode: { lead: "runner", trail: "hunter", warm: false },
    all: { meet: true },
  };

  function run(which) {
    if (stillness() || FRAME !== null) return;
    const width = lane.clientWidth;
    if (width < 260) return;

    // A tab switch mid-run should show the tab you switched to, so the run in
    // flight is abandoned rather than queued behind.
    const mine = ++generation;
    for (const stale of [...lane.children]) stale.remove();

    const plan = RUNS[which] || RUNS["claude-code"];

    const figure = document.createElement("span");
    figure.className = "runner";
    figure.innerHTML = FIGURE;
    const shape = document.createElement("span");
    shape.className = "hunter";
    shape.innerHTML = HUNTER;
    lane.append(figure, shape);

    const bob = (done, phase) => Math.sin(done * 31 + phase) * 1.6;
    const began = performance.now();

    const clear = () => {
      for (const node of [...lane.children]) node.remove();
    };

    if (plan.meet) {
      // They arrive from opposite ends, hold a beat at arm's length, and back off.
      const middle = width / 2;
      const ease = (t) => 1 - Math.pow(1 - t, 3);
      let burst = false;

      const approach = (now) => {
        if (mine !== generation) return;
        const done = Math.min(1, (now - began) / 2900);
        const closing = done < 0.42 ? ease(done / 0.42) : done < 0.66 ? 1 : ease((1 - done) / 0.34);
        const left = -34 + (middle - 46 + 34) * closing;
        const right = width + 34 - (width + 34 - (middle + 10)) * closing;
        figure.style.transform = `translate(${left}px, ${bob(done, 0)}px)`;
        shape.style.transform = `translate(${right}px, ${bob(done, 2.1)}px)`;
        // They turn around at the top of the retreat, so nobody reverses facing
        // the way they came.
        figure.classList.toggle("rightward", done < 0.66);
        shape.classList.toggle("rightward", done >= 0.66);

        if (!burst && done > 0.44) {
          burst = true;
          for (let i = 0; i < 6; i++) {
            const bit = document.createElement("i");
            bit.className = "spark";
            bit.style.left = `${Math.round(middle - 4)}px`;
            bit.style.setProperty("--dx", `${(Math.random() * 26 - 13).toFixed(1)}px`);
            bit.style.setProperty("--dy", `${(Math.random() * 18 - 11).toFixed(1)}px`);
            lane.appendChild(bit);
          }
        }
        if (done < 1) return requestAnimationFrame(approach);
        clear();
      };
      requestAnimationFrame(approach);
      return;
    }

    const lead = plan.lead === "runner" ? figure : shape;
    const trail = plan.lead === "runner" ? shape : figure;
    if (plan.lead === "hunter") figure.classList.add("ahead");

    const crumbs = [];
    const reach = 74;
    const travel = width + 130;
    let last = Infinity;

    function step(now) {
      if (mine !== generation) return;
      const done = Math.min(1, (now - began) / 2400);
      const x = width + 34 - travel * done;
      lead.style.transform = `translate(${x}px, ${bob(done, 0)}px)`;
      trail.style.transform = `translate(${x + reach}px, ${bob(done, 1.7)}px)`;

      if (x < width && x > -12 && x < last - 16) {
        last = x;
        const crumb = document.createElement("i");
        crumb.className = "crumb";
        crumb.style.left = `${Math.round(x + 6)}px`;
        lane.appendChild(crumb);
        crumbs.push(crumb);
      }
      // The oldest crumb lies furthest to the right, so it is always the next one.
      while (crumbs.length && x + reach <= Number.parseFloat(crumbs[0].style.left)) {
        const eaten = crumbs.shift();
        eaten.className = plan.warm ? "crumb gone warm" : "crumb gone";
        setTimeout(() => eaten.remove(), 220);
      }

      if (done < 1) return requestAnimationFrame(step);
      clear();
    }
    requestAnimationFrame(step);
  }

  $("wordmark").addEventListener("click", () => run(agent));

  // On open it should be a surprise rather than furniture, so it waits a few
  // hours between runs of its own accord. The wordmark starts one at any time.
  const RUN_KEY = "revenant.ran";
  const SETTLE = 6 * 60 * 60 * 1000;
  try {
    if (Date.now() - Number(localStorage.getItem(RUN_KEY) || 0) > SETTLE) {
      localStorage.setItem(RUN_KEY, String(Date.now()));
      setTimeout(() => run(agent), 1500);
    }
  } catch (e) { /* storage is off; the wordmark still works */ }

  // Every request gives up in the end: a service that hangs would otherwise
  // leave REVIVE reading RAISING for good.
  const api = (path, options = {}, patience = 30000) => {
    const quit = new AbortController();
    const timer = setTimeout(() => quit.abort(), patience);
    return fetch(path + (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN),
                 { ...options, signal: quit.signal })
      .then((r) => r.json())
      .finally(() => clearTimeout(timer));
  };

  const stop = () => STOPS[Number(el.range.value)];
  const say = (n) => WORDS[n] || String(n);
  const escape = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let wordTimer;
  function word(text, bad) {
    el.word.textContent = text;
    el.word.classList.toggle("bad", Boolean(bad));
    el.word.classList.add("up");
    clearTimeout(wordTimer);
    wordTimer = setTimeout(() => el.word.classList.remove("up"), 5200);
  }

  // ── the ruler ─────────────────────────────────────────────────────────
  // The fraction of the track a stop sits at. The caret, the lit line, the ticks
  // and the labels all come from here, so they cannot drift apart again.
  const where = (i) => (i / (STOPS.length - 1)) * 100;

  el.ticks.innerHTML = STOPS.map((s, i) => `<i style="left:${where(i)}%"></i>`).join("");
  el.marks.innerHTML = STOPS.map((s, i) => {
    // The end labels hang inside the track rather than off its edges.
    const pull = i === 0 ? "0" : i === STOPS.length - 1 ? "-100%" : "-50%";
    return `<button type="button" data-i="${i}" aria-label="Look back ${s.said}"
              style="left:${where(i)}%;transform:translateX(${pull})">${s.mark}</button>`;
  }).join("");
  el.marks.addEventListener("click", (event) => {
    const target = event.target.closest("[data-i]");
    if (!target) return;
    el.range.value = target.dataset.i;
    paintRuler();
    load();
  });

  function paintRuler() {
    const index = Number(el.range.value);
    el.lit.style.width = `${where(index)}%`;
    el.caret.style.left = `${where(index)}%`;
    el.span.textContent = stop().said;
    el.range.setAttribute("aria-valuetext", stop().said);
    for (const node of el.marks.children) {
      node.dataset.on = String(Number(node.dataset.i) === index);
    }
  }

  // Dragging the caret back through time strikes sparks off it. They are spawned
  // on the track rather than the caret itself, which is mid-transition and would
  // carry them along with it.
  const track = el.caret.parentElement;
  let struck = 0;

  function sparks() {
    if (stillness() || performance.now() - struck < 55) return;
    if (track.querySelectorAll(".spark").length > 14) return;
    struck = performance.now();
    for (let i = 0; i < 2; i++) {
      const bit = document.createElement("i");
      bit.className = "spark";
      bit.style.left = el.caret.style.left;
      bit.style.setProperty("--dx", `${(Math.random() * 15 - 5).toFixed(1)}px`);
      bit.style.setProperty("--dy", `${(-9 - Math.random() * 13).toFixed(1)}px`);
      track.appendChild(bit);
      setTimeout(() => bit.remove(), 640);
    }
  }

  el.register.addEventListener("scroll", paintEdge, { passive: true });
  addEventListener("resize", paintEdge);

  let hold;
  el.range.addEventListener("input", () => {
    paintRuler();
    sparks();
    clearTimeout(hold);
    hold = setTimeout(load, 190);
  });

  // ── data ──────────────────────────────────────────────────────────────
  // Sessions raised a moment ago are left unmarked when the list reloads: until
  // their new processes register as live they still look dead, and a second
  // click would open each of them twice.
  const raised = new Map();
  const RAISED_FOR = 2 * 60 * 1000;
  const freshlyRaised = (id) => Date.now() - (raised.get(id) ?? -Infinity) < RAISED_FOR;

  async function load() {
    const mine = ++seq;
    el.register.classList.add("loading");
    let data;
    try {
      // A cold read of every transcript on a heavy machine can take a while;
      // only a service that says nothing for two minutes is taken for dead.
      data = await api(`/api/sessions?days=${stop().days}${agent ? "&agent=" + agent : ""}`, {}, 120000);
    } catch (e) {
      if (mine !== seq) return;
      // Leaving the loading class on would dim the register for good, including
      // every row a later reload paints under it.
      el.register.classList.remove("loading");
      typed = true;
      el.claim.dataset.typing = "false";
      el.claim.textContent = e && e.name === "AbortError"
        ? "Reading the transcripts took too long. Press Ctrl+R to try again."
        : "The local service stopped answering.";
      el.rows.innerHTML = "";
      return;
    }
    if (mine !== seq) return;
    el.register.classList.remove("loading");

    if (data.agents) paintTabs(data.agents, data.agent);
    opens = data.layouts || {};
    paintMode();
    if (data.error) {
      el.claim.textContent = "Nothing to read.";
      el.where.textContent = data.error;
      sessions = [];
      chosen.clear();
      paint();
      return;
    }

    // Screenshots and recordings name the default place, never the temporary
    // folder the synthetic sessions they are made from sits in.
    el.where.textContent = document.documentElement.dataset.still || FRAME !== null
      ? `Reading transcripts in ${{codex: "~/.codex", opencode: "~/.local/share/opencode", all: "several places"}[data.agent] || "~/.claude"}`
      : `Reading transcripts in ${data.root}`;

    const all = data.sessions || [];
    sessions = [...all.filter((s) => !s.live), ...all.filter((s) => s.live)];
    all.forEach((s) => { if (s.live) raised.delete(s.sessionId); });
    chosen = new Set(sessions.filter((s) => !s.live && !freshlyRaised(s.sessionId)).map((s) => s.sessionId));
    paint();
  }

  function paintTabs(list, current) {
    agent = current || agent;
    if (!list.length) {
      el.tabs.innerHTML = "";
      return;
    }
    el.tabs.innerHTML = list
      .map((a) => `<button type="button" data-key="${escape(a.key)}" aria-current="${a.key === current}"
                     title="${escape(a.note || "")}">${escape(a.label.toUpperCase())}</button>`)
      .join("");
    el.tabs.querySelectorAll("button").forEach((node) => {
      node.addEventListener("click", () => {
        if (node.dataset.key === agent) return;
        agent = node.dataset.key;
        run(agent);
        load();
      });
    });
  }

  // The first claim is typed out under a block cursor. Every later one lands at
  // once, because by then the reader is waiting on an answer rather than a show.
  let typewriter = null;

  function claim(text) {
    clearTimeout(typewriter);
    if (typed || stillness()) {
      el.claim.textContent = text;
      el.claim.dataset.typing = "false";
      typed = true;
      return;
    }
    typed = true;
    el.claim.dataset.typing = "true";
    el.claim.textContent = "";
    let cut = 0;
    (function letter() {
      el.claim.textContent = text.slice(0, ++cut);
      if (cut < text.length) return void (typewriter = setTimeout(letter, 17));
      typewriter = setTimeout(() => { el.claim.dataset.typing = "false"; }, 2200);
    })();
  }

  function paint() {
    const open = sessions.filter((s) => !s.live);
    const held = sessions.length - open.length;

    // Count what can actually be raised: saying "eight outlived their terminals"
    // when all eight are still running reads as a lie.
    if (!sessions.length) {
      claim(`Nothing in the last ${stop().said}.`);
    } else if (!open.length) {
      claim(`${say(held)} session${held === 1 ? " is" : "s are"} still running.`);
    } else {
      claim(`${say(open.length)} session${open.length === 1 ? "" : "s"} outlived ` +
        `${open.length === 1 ? "its terminal" : "their terminals"}.`);
    }

    if (!sessions.length) {
      el.rows.innerHTML = `
        <div class="ghost-rule"></div><div class="ghost-rule"></div><div class="ghost-rule"></div>
        <div class="blank">
          <span class="pale" aria-hidden="true">${FIGURE}</span>
          ${MOTES}
          <p>No agent session was active in this window.</p>
          <small>Drag the caret right to look further back.<br>
                 Nothing here is deleted. Transcripts stay on disk for as long as your agent keeps them.</small>
        </div>`;
    } else {
      const many = new Set(sessions.map((s) => s.agent)).size > 1;
      el.rows.innerHTML = sessions.map((s, i) => row(s, i, many)).join("");
      el.rows.querySelectorAll(".row").forEach((node) => {
        const copy = node.querySelector(".copy-path");
        if (copy) {
          copy.addEventListener("click", async (event) => {
            event.stopPropagation();
            const session = sessions.find((s) => s.sessionId === node.dataset.id);
            try {
              await copyText(session.cwd);
              word("Path on the clipboard.");
            } catch { word("Could not copy the path. Select it and press Ctrl+C.", true); }
          });
          copy.addEventListener("dblclick", (event) => event.stopPropagation());
          copy.addEventListener("keydown", (event) => event.stopPropagation());
        }
        node.addEventListener("click", () => {
          if (window.getSelection()?.toString()) return;
          if (node.dataset.held !== "true") toggle(node.dataset.id);
        });
        node.addEventListener("dblclick", (event) => {
          if (!event.target.closest(".path")) reveal(node);
        });
        node.addEventListener("keydown", (event) => {
          if (event.key.toLowerCase() === "o") {
            event.preventDefault();
            reveal(node);
          }
          if (event.key === " " && node.dataset.held !== "true") {
            event.preventDefault();
            toggle(node.dataset.id);
          }
          // Space marks the row. Enter revives, here as
          // anywhere: after a click the row has focus, and Enter toggling it back
          // was a surprise.
          if (event.key === "Enter" && node.dataset.held !== "true") {
            event.preventDefault();
            if (!el.raise.disabled) el.raise.click();
          }
        });
      });
    }
    paintTally(open.length, held);
    paintEdge();
  }

  function paintEdge() {
    const box = el.register;
    // Writing on every scroll event would dirty style for the next one's read.
    const more = String(box.scrollTop + box.clientHeight < box.scrollHeight - 2);
    if (box.dataset.more !== more) box.dataset.more = more;
  }

  function reveal(node) {
    api("/api/reveal", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids: [node.dataset.id], days: stop().days, agent }),
    }).then((r) => { if (!r.ok) word(r.message || "That folder is gone.", true); });
  }

  function row(s, index, many) {
    const on = chosen.has(s.sessionId);
    const turns = s.turns == null ? "" : s.turns;
    const who = many
      ? `<span class="who" data-agent="${escape(s.agent)}">${escape((s.agentLabel || "").toUpperCase())}</span>`
      : "";
    const flag = s.live
      ? `<span class="flag">HELD, ${escape((s.liveReason || "").toUpperCase())}</span>`
      : "";
    const name = s.title || s.firstPrompt || s.summary || s.label;
    const said = `<span class="said">${escape(s.summary || s.lastPrompt || s.firstPrompt || "")}</span>`;
    return `<div class="row enter" role="button" tabindex="0" data-id="${escape(s.sessionId)}"
        data-on="${on}" data-held="${Boolean(s.live)}"
        aria-pressed="${on}" aria-disabled="${Boolean(s.live)}"
        title="Click or press Space to mark. Double click, or press O, to open the folder."
        style="animation-delay:${Math.min(index * 26, 320)}ms">
      <span class="age">${escape(s.ageLabel || "")}</span>
      <span class="mark"><i></i></span>
      <span class="body">
        <span class="name-line">
          <span class="name" title="${escape(name)}">${escape(name)}</span>${who}${flag}
        </span>
        <span class="path-line">
          <span class="path" title="${escape(s.cwd || "directory unknown")}">${escape(s.cwd || "directory unknown")}</span>
          ${s.cwd ? '<button class="copy-path" type="button" title="Copy folder path" aria-label="Copy folder path" aria-disabled="false">copy path</button>' : ""}
        </span>
        ${said}
      </span>
      <span class="turns">${turns}</span>
    </div>`;
  }

  function toggle(id) {
    if (chosen.has(id)) chosen.delete(id);
    else chosen.add(id);
    const node = el.rows.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
    if (node) {
      node.dataset.on = String(chosen.has(id));
      node.setAttribute("aria-pressed", node.dataset.on);
    }
    repaintTally();
  }

  function repaintTally() {
    const open = sessions.filter((s) => !s.live).length;
    paintTally(open, sessions.length - open);
  }

  function paintTally(open, held) {
    const n = chosen.size;
    const heldWord = held ? ` ${held} held back.` : "";
    el.tally.innerHTML = open
      ? `<b>${n}</b> of ${open} marked.${heldWord}` +
        ` <span class="hint">Double click a row to open its folder.</span>`
      : (held ? `${held} held back, nothing to raise.` : "Nothing to raise.");
    el.raise.disabled = n === 0;
    // A revival in flight keeps its word on the button whatever else repaints.
    el.raise.textContent = el.raise.dataset.busy === "true" ? "RAISING" : n ? `REVIVE ${n}` : "REVIVE";
  }

  // ── actions ───────────────────────────────────────────────────────────
  $("markall").addEventListener("click", () => {
    const open = sessions.filter((s) => !s.live);
    if (chosen.size === open.length) chosen.clear();
    else open.forEach((s) => chosen.add(s.sessionId));
    paint();
  });

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const scratch = document.createElement("textarea");
      scratch.value = text;
      scratch.style.cssText = "position:fixed;left:-9999px;top:0";
      const focused = document.activeElement;
      document.body.appendChild(scratch);
      scratch.select();
      try {
        if (!document.execCommand("copy")) throw new Error("Clipboard unavailable");
      } finally {
        scratch.remove();
        focused?.focus({ preventScroll: true });
      }
    }
  }

  $("copy").addEventListener("click", async () => {
    if (!chosen.size) return word("Mark a session first.");
    const data = await api("/api/commands", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids: [...chosen], days: stop().days, agent }),
    });
    try { await copyText(data.text); }
    catch { return word("Could not copy commands.", true); }
    word(`${data.count} command pair${data.count === 1 ? "" : "s"} on the clipboard.` +
      (data.dropped ? ` The other ${data.dropped} did not fit in one request.` : ""));
  });

  // ── the shuffle ───────────────────────────────────────────────────────
  // A revival of more than five sessions is dealt rather than stamped: the
  // figure from the icon shuffles a deck of terminals with its eyes shut,
  // keeping time with its head, then deals them into one window or several.
  // The whole scene is one function of elapsed time, so any moment can be
  // drawn exactly, which is how it is tested. Every class it adds starts with
  // sh-, because the page already styles .bar, .name and .body globally.
  const SHUFFLE_FROM = 6;
  // How long before the first window is due the revival is sent, for the
  // service to check the sessions first. It holds the rest of the wait itself.
  const ASK_AHEAD = 500;

  // The grave mist the figure rises out of: value noise summed over five
  // octaves, streaked along the ground inside a ragged edge that thins upward
  // and is gone before the border, so no edge of a texture ever shows. Only
  // the alpha is computed here; it is a pure function of its arguments.
  function mistField(seed, w, h, fx, fy, cy, lo, hi) {
    const smooth = (a, b, x) => {
      const p = Math.max(0, Math.min(1, (x - a) / (b - a)));
      return p * p * (3 - 2 * p);
    };
    const G = 64, grid = new Float32Array(G * G);
    let r = seed;
    for (let i = 0; i < grid.length; i++) {
      r = (r * 1664525 + 1013904223) >>> 0;
      grid[i] = r / 4294967296;
    }
    const at = (x, y) => grid[(y & (G - 1)) * G + (x & (G - 1))];
    const noise = (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), u = x - xi, v = y - yi;
      const a = u * u * (3 - 2 * u), b = v * v * (3 - 2 * v);
      const top = at(xi, yi) + (at(xi + 1, yi) - at(xi, yi)) * a;
      const bottom = at(xi, yi + 1) + (at(xi + 1, yi + 1) - at(xi, yi + 1)) * a;
      return top + (bottom - top) * b;
    };
    const alpha = new Uint8ClampedArray(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const u = x / (w - 1), v = y / (h - 1);
        let n = 0;
        for (let o = 0, amp = 0.5, f = 1; o < 5; o++, amp *= 0.5, f *= 2.03) {
          n += amp * noise(u * fx * f + o * 7.1, v * fy * f + o * 3.3);
        }
        const across = Math.abs(u - 0.5) * 2 + (n - 0.5) * 0.7;
        const up = (v - cy) * 2;
        const tall = (up < 0 ? -up * 1.35 : up * 1.9) + (n - 0.5) * 0.9;
        const frame = smooth(0, 0.12, u) * smooth(0, 0.12, 1 - u) * smooth(0, 0.14, v) * smooth(0, 0.14, 1 - v);
        alpha[y * w + x] = Math.round((1 - smooth(0.35, 1, across)) * (1 - smooth(0.2, 1, tall)) * frame *
                                      smooth(lo, hi, n) * 255);
      }
    }
    return alpha;
  }

  // Two banks that lie along the ground, a billow to rise through, and a wisp
  // to cling to its sides: seed, size, grain across and up, where the body of
  // it sits, and the noise it takes to show.
  const MIST_PLAN = [[11, 256, 80, 2.2, 5, 0.62, 0.3, 0.85], [29, 256, 80, 2.6, 5.5, 0.58, 0.3, 0.85],
                     [47, 128, 128, 3.2, 2.4, 0.66, 0.25, 0.8], [83, 48, 128, 3.5, 1.6, 0.5, 0.3, 0.85]];
  // Each is drawn once, in a cold grey, and kept as an image the scene only
  // moves and fades. Drawing all four is too long a task for one frame, so the
  // page draws one each time it is idle; a deal that comes first draws the
  // rest then. Without a canvas (a test's stand-in DOM) the scene plays
  // without mist.
  const mists = [];
  function paintMist(plan) {
    const [, w, h] = plan;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext ? canvas.getContext("2d") : null;
    if (!ctx) return "";
    canvas.width = w;
    canvas.height = h;
    const img = ctx.createImageData(w, h);
    const alpha = mistField(...plan);
    for (let i = 0; i < alpha.length; i++) {
      img.data[i * 4] = 202;
      img.data[i * 4 + 1] = 210;
      img.data[i * 4 + 2] = 208;
      img.data[i * 4 + 3] = alpha[i];
    }
    ctx.putImageData(img, 0, 0);
    return `url(${canvas.toDataURL()})`;
  }
  function mist() {
    while (mists.length < MIST_PLAN.length) mists.push(paintMist(MIST_PLAN[mists.length]));
    return mists;
  }

  function startShuffle(host, opts) {
    const N = opts.count;
    const LAYOUT = opts.layout === "windows" ? "windows" : "tabs";
    // The toast that says what is happening sits over the foot of the stage, so
    // the scene is composed in the room above it.
    const W = host.clientWidth, H = host.clientHeight - (opts.below || 0);
    const bezier = (x1, y1, x2, y2) => (x) => {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 6; i++) {
        const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x;
        const d = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t;
        if (Math.abs(d) < 1e-6) break;
        t -= cx / d;
      }
      return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3;
    };
    // The house easing, solved properly so that script motion and CSS motion
    // follow the same curve.
    const ease = bezier(0.2, 0.8, 0.2, 1);
    const clamp = (v) => Math.max(0, Math.min(1, v));
    const span = (t, a, b) => clamp((t - a) / (b - a));
    const lerp = (a, b, p) => a + (b - a) * p;
    const arc = (p) => Math.sin(p * Math.PI);
    // A fixed scatter per card, so a frame drawn twice comes out the same.
    const jitter = (id, salt) => {
      const h = Math.sin((id + 1) * 12.9898 + salt * 78.233) * 43758.5453;
      return (h - Math.floor(h)) * 2 - 1;
    };

    // The scene runs at half speed: at full speed the riffle is over before the
    // eye has found it. Everything below is written in scene time, and only the
    // clock at the bottom converts.
    const PACE = 2;
    // Timeline in scene ms. The launch is asked for at T.launch, while the cards
    // are still in the air: the terminals take a moment to appear, and the one
    // that lands on top reads as where they were going.
    const BEAT = 320;
    const T = { split1: 600, riffle1: 760, split2: 1080, riffle2: 1240, square: 1560, launch: 1680 };
    // It comes up out of the mist before the cards gather, the lower half of
    // it still dissolved in the mist until it is nearly out, so what shows
    // first is a figure and not a bare dome; it wakes as it clears the mist.
    // Nothing else in the scene moves faster than this does.
    const RISE = { from: 30, to: 470, wake: 300, depth: 84 };
    const GATHER = 230;
    const SHOWN = Math.min(N, 12);
    const DEAL = Math.min(62, 640 / Math.max(1, SHOWN - 1));
    const FLIGHT = 460;
    const LANDED = T.launch + DEAL * (SHOWN - 1) + FLIGHT;
    const END = LANDED + 520;

    // The scene is composed for a stage of at least 860 x 280 and scaled down
    // whole to fit a smaller one, so a grid of twelve never runs off the edge of
    // a minimum-size window. A wide stage keeps the composition and centres it
    // rather than spreading the cards across a gulf.
    const k = Math.min(1, W / 860, H / 280);
    const VW = Math.min(W / k, 1120), VH = H / k;
    const ox = (W - VW * k) / 2;

    const CW = 70, CH = 52;
    const ghost = { x: VW * 0.21, y: VH * 0.5, size: 150 };
    const floorY = ghost.y + 64;
    const deck = { x: VW * 0.42, y: VH * 0.47 };
    const dest = { x: VW * (LAYOUT === "windows" ? 0.715 : 0.74), y: VH * 0.49 };
    const WIN = { w: 320, h: 200 };
    const MINI = { w: 96, h: 68 };

    host.style.setProperty("--gx", `${(((ox + ghost.x * k) / W) * 100).toFixed(1)}%`);
    host.innerHTML = `<div class="sh-veil"></div>` +
      `<div class="sh-scene" style="width:${VW}px;height:${VH}px;transform:translate(${ox}px,0) scale(${k})">` +
      `<div class="sh-floor" style="top:${floorY}px"></div><i class="sh-shadow"></i></div>`;
    const veil = host.querySelector(".sh-veil");
    const scene = host.querySelector(".sh-scene");
    const floor = host.querySelector(".sh-floor");
    const shadow = host.querySelector(".sh-shadow");

    const accent = (i) => `var(--${{codex: "codex", opencode: "opencode"}[opts.agents[i]] || "ember"})`;
    const add = (tag, cls) => {
      const node = document.createElement(tag);
      node.className = cls;
      scene.appendChild(node);
      return node;
    };

    // Shadows go down first, under everything that casts them.
    const casts = [...Array(SHOWN)].map(() => add("i", "sh-cast"));

    // The grave mist it rises out of: banks lying along the floor behind the
    // figure and in front of it, a billow it comes up through, and two wisps
    // drawn up its sides. Under them an ember glow, its own light coming up
    // through the mist before it does. The mist gathers under the middle of
    // the body, which is 22 units into the drawing's 58, not at its centre.
    const UNIT = ghost.size / 58;
    const under = { x: ghost.x + (22 - 29) * UNIT, y: floorY };
    const MIST = mist();
    const haze = (tex, w, h, near) => {
      const node = add("i", near ? "sh-mist sh-near" : "sh-mist");
      node.style.width = `${w}px`;
      node.style.height = `${h}px`;
      if (MIST[tex]) node.style.backgroundImage = MIST[tex];
      return node;
    };
    // Each bank: texture, size, centre from `under`, and how far it drifts.
    // None reaches more than 150 px to the left of the figure, which at the
    // smallest stage is the edge of it.
    const BANKS_BACK = [[0, 300, 100, 0, -24, -16], [1, 280, 90, 60, -32, 14]];
    const BANKS_FRONT = [[1, 300, 84, 0, 8, 18], [0, 240, 74, -30, 14, -16], [2, 200, 64, 90, 4, 10]];
    const earth = add("i", "sh-earth");
    const banksBack = BANKS_BACK.map(([tex, w, h]) => haze(tex, w, h));
    const glow = add("i", "sh-ember");
    // The billows go up behind it: in front they washed the colour out of it.
    const BILLOWS = [[40, 170, 150, -14, -40, 80, 1], [90, 150, 130, 26, -30, 60, -1],
                     [140, 130, 120, -46, -22, 66, 1]];
    const billows = BILLOWS.map(([, w, h]) => haze(2, w, h));

    const figure = add("div", "sh-ghost");
    figure.style.width = figure.style.height = `${ghost.size}px`;
    figure.innerHTML = opts.figure;
    const face = figure.querySelector(".sh-face");
    const eyes = figure.querySelector(".eyes");
    const bliss = figure.querySelector(".sh-bliss");
    const sleep = figure.querySelector(".sh-sleep");
    const pupils = [...figure.querySelectorAll(".pupil")];
    const peaks = [...figure.querySelectorAll(".peak")];
    const tipShade = figure.querySelector(".tip-shade");
    // Where each point of the hem joins the body, read off its own path so a
    // redrawn hem cannot leave the ripple swinging from the wrong place.
    const roots = peaks.map((peak) => {
      const found = /M([\d.]+)[ ,]([\d.]+)h([\d.]+)/.exec(peak.getAttribute("d") || "");
      return found ? [Number(found[1]) + Number(found[3]) / 2, Number(found[2])] : [22, 41.4];
    });
    const mouthO = figure.querySelector(".sh-o");
    const mouthLine = figure.querySelector(".sh-line");
    // The sheet's outline and its light and shade, redrawn as it trails.
    const cloth = { body: figure.querySelector(".body"), shade: figure.querySelector(".shade"),
                    sheen: figure.querySelector(".sheen") };

    const banksFront = BANKS_FRONT.map(([tex, w, h]) => haze(tex, w, h, true));
    // The wisps cling to its sides, from the floor up to its waist.
    const WISPS = [4.5, 39.5];
    const wisps = WISPS.map(() => {
      const wisp = haze(3, 44, 120);
      wisp.style.transformOrigin = "50% 100%";
      return wisp;
    });
    let cleared = false;

    // The riffle: cut into halves and interleave them, twice.
    const riffle = (order) => {
      const half = Math.ceil(order.length / 2), L = order.slice(0, half), R = order.slice(half), out = [];
      for (let i = 0; i < half; i++) {
        if (L[i] !== undefined) out.push(L[i]);
        if (R[i] !== undefined) out.push(R[i]);
      }
      return out;
    };
    const order0 = [...Array(SHOWN).keys()];
    const order1 = riffle(order0);
    const order2 = riffle(order1);
    // Cards come off the top of the deck in the order the terminals open, so
    // the k-th card dealt is the k-th session and lands in the k-th slot. The
    // riffle is fixed, so each card knows from the start which one it will be.
    const rank = (id) => order2.length - 1 - order2.indexOf(id);
    const more = N - SHOWN;
    let win = null, screen = null, tabW = 0, tabTop = 6, tabH = 20;
    let tabs = [], minis = [], holes = [];
    // The one window, drawn where the service says the real one will open once
    // it has said so, and as a small stand-in on the right until then.
    let box = { x: dest.x - WIN.w / 2, y: dest.y - WIN.h / 2, w: WIN.w, h: WIN.h };
    const frameOf = (w, h, stripH, withScreen) => {
      const node = add("div", "sh-win");
      node.style.cssText = `width:${w}px;height:${h}px`;
      node.innerHTML = `<div class="sh-strip" style="height:${stripH}px"></div>` + (withScreen
        ? `<div class="sh-screen" style="top:${stripH + 14}px"><b>&gt;</b> ` +
          `<span class="sh-typed"></span><span class="sh-cursor"></span>\n<span class="sh-said"></span></div>`
        : "");
      return node;
    };
    // A tab wide enough to read carries its session's name, as the real one will.
    const tabIn = (strip, left, i, named) => {
      const tab = document.createElement("div");
      tab.className = "sh-tab";
      tab.style.cssText = `left:${left}px;width:${tabW}px;top:${tabTop}px;height:${tabH}px;--accent:${accent(i)}`;
      tab.innerHTML = `<b class="sh-glow"></b><i></i>` + (named ? `<span class="sh-title"></span>` : "");
      if (named) tab.lastChild.textContent = opts.names[i] || "";
      tab.dataset.cx = left + tabW / 2;
      strip.appendChild(tab);
      return tab;
    };
    const tabsIn = (node, room) => {
      const strip = node.querySelector(".sh-strip");
      const slot = Math.min(room.most, (room.width - (more > 0 ? 30 : 0)) / SHOWN);
      tabW = slot - 3;
      tabs = [...Array(SHOWN)].map((_, i) => tabIn(strip, 8 + i * slot, i, tabW >= 56));
      if (more > 0) {
        const tail = document.createElement("span");
        tail.className = "sh-more";
        tail.style.cssText = `left:${12 + SHOWN * slot}px;top:${tabTop + tabH / 2 - 5}px`;
        tail.textContent = `+${more}`;
        strip.appendChild(tail);
      }
      screen = { typed: node.querySelector(".sh-typed"), said: node.querySelector(".sh-said") };
    };
    if (LAYOUT === "tabs") {
      win = frameOf(WIN.w, WIN.h, 26, true);
      tabsIn(win, { most: 34, width: WIN.w - 16 });
    } else {
      const cols = 4, rows = Math.ceil(SHOWN / cols);
      for (let i = 0; i < SHOWN; i++) {
        const m = document.createElement("div");
        m.className = "sh-mini";
        m.style.cssText = `width:${MINI.w}px;height:${MINI.h}px;--accent:${accent(i)}`;
        m.innerHTML = `<i class="sh-bar"></i><span class="sh-name"></span>
                       <b class="sh-prompt">&gt;</b><i class="sh-cursor"></i>`;
        m.querySelector(".sh-name").textContent = opts.names[i] || "";
        // A short last row sits centred under the full ones, not hard left.
        const col = i % cols, row = Math.floor(i / cols), inRow = Math.min(cols, SHOWN - row * cols);
        m.dataset.x = dest.x + (col - (inRow - 1) / 2) * (MINI.w + 14) + (row % 2 ? 7 : -7);
        m.dataset.y = dest.y + (row - (rows - 1) / 2) * (MINI.h + 16);
        m.dataset.r = (((i * 37) % 7) - 3) * 0.8;
        const hole = add("i", "sh-hole");
        hole.style.cssText = `width:${MINI.w}px;height:${MINI.h}px;transform:translate(` +
          `${m.dataset.x - MINI.w / 2}px, ${m.dataset.y - MINI.h / 2}px) rotate(${m.dataset.r}deg)`;
        holes.push(hole);
        scene.appendChild(m);
        minis.push(m);
      }
      if (more > 0) {
        const tail = add("span", "sh-more");
        tail.style.cssText = `left:${dest.x - 10}px;top:${dest.y + (rows / 2) * (MINI.h + 16) + 2}px`;
        tail.textContent = `+${more}`;
        holes.push(tail);
      }
    }

    const cards = [], boots = [];
    for (let i = 0; i < SHOWN; i++) {
      const c = add("div", "sh-card");
      c.style.cssText = `width:${CW}px;height:${CH}px;--accent:${accent(rank(i))}`;
      c.innerHTML = `<b class="sh-seed"></b><i class="sh-bar"></i><i class="sh-dot"></i>` +
                    `<b class="sh-prompt">&gt;_</b><i class="sh-ln sh-ln-a"></i><i class="sh-ln sh-ln-b"></i>` +
                    `<b class="sh-boot"></b>`;
      cards.push(c);
      boots.push(c.querySelector(".sh-boot"));
    }
    // Small flicks of air where a riffled card lands on the pile, and a few
    // notes for the tune it is keeping time to.
    const ticks = [...Array(4)].map(() => add("i", "sh-tick"));
    const NOTES = [[720, "♪", 1], [1020, "♫", -1], [1300, "♪", 1]];
    const notes = NOTES.map(([, glyph]) => {
      const note = add("span", "sh-note");
      note.textContent = glyph;
      return note;
    });

    // Where each card starts: on the mark of its own row, measured by the
    // caller in stage pixels and brought into the scaled scene here.
    const origin = (id) => {
      const o = opts.origins && opts.origins[rank(id)];
      return o ? { x: (o.x - ox) / k, y: o.y / k } : null;
    };
    // A deck shows its edge: each card sits 2.4 px above the one beneath it.
    const stackPos = (i) => ({ x: deck.x + i * 0.5, y: deck.y - i * 2.4 });
    // Halves held apart and bowed inward, the way two hands bend them first.
    const halfPos = (side, i) => ({ x: deck.x + side * 92 + i * 0.5, y: deck.y - 10 - i * 2.4, r: -side * 14 });
    const stagger = Math.min(30, 250 / Math.max(1, SHOWN - 1));

    function riffleCard(id, before, after, tSplit, tRiffle, t) {
      const half = Math.ceil(before.length / 2);
      const k0 = before.indexOf(id), side = k0 < half ? -1 : 1, kh = side < 0 ? k0 : k0 - half;
      const k1 = after.indexOf(id);
      const from = stackPos(k0), held = halfPos(side, kh), to = stackPos(k1);
      if (t < tSplit) return { ...from, r: 0, skew: 0, ps: 0, pd: 0 };
      const ps = ease(span(t, tSplit, tSplit + 160));
      // Held, the halves flex under the thumbs.
      if (t < tRiffle) {
        return { x: lerp(from.x, held.x, ps), y: lerp(from.y, held.y, ps) - arc(ps) * 12,
                 r: held.r * ps, skew: side * 9 * ps, ps, pd: 0 };
      }
      // Released bottom card first and alternating sides, which is the zipper;
      // each card snaps flat and a little past it before it lies still.
      const drop = tRiffle + k1 * stagger;
      const pd = ease(span(t, drop, drop + 180));
      return { x: lerp(held.x, to.x, pd), y: lerp(held.y, to.y, pd) - arc(pd) * 16, r: lerp(held.r, 0, pd),
               skew: lerp(side * 9, 0, pd) - side * 5 * arc(pd), ps: 1, pd };
    }

    // The groove: a guitarist keeping time with the head. Each beat drops hard
    // onto the downbeat, squashes on the hit and springs back past rest before
    // it settles. Beats one and three land harder, and the tilt swings from
    // side to side on alternate beats.
    const ACCENT = [1, 0.55, 0.8, 0.55];
    const groove = (t) => {
      const on = span(t, T.split1 - 120, T.split1) * (1 - span(t, T.launch, T.launch + 280));
      const since = Math.max(0, t - T.split1);
      const beat = Math.floor(since / BEAT), p = (since % BEAT) / BEAT;
      const q = (p - 0.18) / 0.82;
      const d = p < 0.18 ? (p / 0.18) ** 2 : Math.exp(-3 * q) * Math.cos(4 * q);
      return { d, a: ACCENT[beat % 4] * on, side: beat % 2 ? 1 : -1, on, p, beat };
    };

    // Where the figure is at scene time t. A pure function of it, so the sheet
    // can be dragged behind the head by comparing two moments.
    const rising = bezier(0.3, 0, 0.25, 1);
    function pose(t) {
      const g = groove(t);
      const hit = Math.max(0, g.d) ** 3 * g.a;
      const lift = Math.max(0, -g.d) * g.a;
      const tap = t >= T.square ? arc(span(t, T.square, T.square + 200)) : 0;
      const sway = Math.sin(((t - T.split1) / (BEAT * 2)) * Math.PI) * 2.4 * g.on;
      const hover = Math.sin((t - T.launch) / 420) * 2.2 * span(t, T.launch + 240, T.launch + 600);
      const hop = -arc(span(t, LANDED, LANDED + 340)) * 8;
      // Out of the ground: easing off it and easing to a stop, a little
      // past its mark and back.
      const p = span(t, RISE.from, RISE.to);
      const risen = rising(p) + 0.03 * arc(span(p, 0.6, 1));
      return { g, hit, lift, tap, sway, hop, rot: g.d * g.a * (g.side * 3.4 - 1.4),
               gy: (1 - risen) * RISE.depth + g.d * g.a * 4.6 + tap * 3 + hover + hop };
    }

    // The sheet below the waist, bent `drag` units sideways and flared `flare`
    // units out at the hem, with its light and shade bent along with it.
    const n2 = (v) => v.toFixed(2);
    // Rewriting a path makes the browser parse its geometry again, so a sheet
    // that has not moved since the last frame is left as it is.
    let draped = "";
    function drape(drag, flare) {
      const key = `${n2(drag)} ${n2(flare)}`;
      if (key === draped) return;
      draped = key;
      const l = drag - flare, r = drag + flare;
      if (cloth.body) {
        cloth.body.setAttribute("d", `M${n2(4 + l)} 42C${n2(4 + l * 0.3)} 35 4 28 4 21C4 10.5 12 2.5 22 2.5` +
          `S40 10.5 40 21C40 28 ${n2(40 + r * 0.3)} 35 ${n2(40 + r)} 42z`);
      }
      if (cloth.shade) {
        cloth.shade.setAttribute("d", `M30 3.6C36 7 40 13.4 40 21C40 28 ${n2(40 + r * 0.3)} 35 ${n2(40 + r)} 42` +
          `h-6C${n2(34 + r * 0.3)} 35 34 28 34 21c0-7-1.6-13.2-4-17.4z`);
      }
      if (cloth.sheen) {
        cloth.sheen.setAttribute("d", `M14.6 5.2C11 8.6 9 14.2 9 21C9 25 ${n2(9 + l * 0.05)} 26.5 ${n2(9 + l * 0.13)} 28.5` +
          `C${n2(9 + l * 0.13)} 30.8 ${n2(7.4 + l * 0.25)} 32.8 ${n2(6 + l * 0.38)} 34C${n2(6 + l * 0.2)} 30 6 25 6 21` +
          `c0-6.6 3.2-12.8 8.6-15.8z`);
      }
    }

    // The mist gathers on the floor before the figure comes, is stirred up as
    // it rises, and settles into a thin ground mist that stays with it.
    function mistAt(t, out, gy) {
      const gather = ease(span(t, 0, 220));
      const settle = ease(span(t, RISE.to - 60, RISE.to + 700));
      const thick = gather * (1 - 0.7 * settle) * out;
      earth.style.opacity = (gather * out).toFixed(3);
      earth.style.transform = `translate(${(under.x - 190).toFixed(1)}px, ${under.y}px)`;
      const bank = (node, [, w, h, dx, dy, drift], i, depth) => {
        const x = under.x + dx - w / 2 + drift * ease(span(t, 0, 1600)) + Math.sin(t / 900 + i * 2.1) * 6;
