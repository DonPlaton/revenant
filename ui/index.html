        const y = under.y + dy - h / 2 + (1 - gather) * 10 + settle * 5;
        node.style.opacity = (depth * thick * (0.9 + 0.1 * Math.sin(t / 640 + i))).toFixed(3);
        node.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) ` +
          `scale(${(lerp(0.45, 1, gather) - 0.12 * settle).toFixed(3)}, ${(lerp(0.6, 1, gather) - 0.2 * settle).toFixed(3)})`;
      };
      banksBack.forEach((node, i) => bank(node, BANKS_BACK[i], i, 0.72));
      banksFront.forEach((node, i) => bank(node, BANKS_FRONT[i], i + 2, 0.85));
      if (t >= RISE.to + 620) {
        if (!cleared) {
          cleared = true;
          [glow, ...billows, ...wisps].forEach((node) => { node.style.opacity = "0"; });
        }
        return;
      }
      cleared = false;
      // The glow swells as the figure nears the surface and dies as it wakes.
      const lit = ease(span(t, 20, 200)) * (1 - ease(span(t, RISE.wake - 40, RISE.to + 200)));
      glow.style.opacity = (lit * 0.7 * out).toFixed(3);
      glow.style.transform = `translate(${(under.x - 140).toFixed(1)}px, ${(under.y - 92).toFixed(1)}px) ` +
        `scale(${lerp(0.7, 1.1, lit).toFixed(3)})`;
      billows.forEach((node, i) => {
        const [at, w, h, dx, dy, climb, face] = BILLOWS[i];
        const q = span(t, at, at + 520), grow = lerp(0.6, 1.35, ease(q));
        node.style.opacity = (span(q, 0, 0.2) * (1 - ease(span(q, 0.3, 1))) * 0.5 * out).toFixed(3);
        node.style.transform = `translate(${(under.x + dx - w / 2).toFixed(1)}px, ` +
          `${(under.y + dy - h / 2 - climb * ease(q)).toFixed(1)}px) scale(${(face * grow).toFixed(3)}, ${grow.toFixed(3)})`;
      });
      // Drawn up its sides from the floor as it climbs, and let go as it
      // clears the mist.
      const waist = ghost.y - ghost.size / 2 + gy + 30 * UNIT;
      const gone = span(t, RISE.to - 90, RISE.to + 120);
      wisps.forEach((node, i) => {
        const reach = Math.max(0.15, Math.min(1.5, (under.y + 12 - waist) / 120));
        node.style.opacity = (span(t, RISE.from + 60, RISE.from + 140) * (1 - gone) * 0.55 * out).toFixed(3);
        node.style.transform = `translate(${(ghost.x - ghost.size / 2 + WISPS[i] * UNIT - 22).toFixed(1)}px, ` +
          `${(under.y + 12 - 120 - gone * 20).toFixed(1)}px) scale(1, ${reach.toFixed(3)})`;
      });
    }

    // Three mouths: a level line while it waits, an O while it sings along to
    // the beat, and a smile once the deal is under way, wider when it lands.
    // One gives way before the next arrives, so no frame shows both.
    function mouth(t, g) {
      const sing = span(t, T.split1 - 45, T.split1 + 20) * (1 - span(t, T.square, T.square + 90));
      const shown = (1 - span(t, T.split1 - 70, T.split1 - 45)) + span(t, T.square + 80, T.square + 150);
      const beam = ease(span(t, T.square + 80, T.square + 240));
      const grin = ease(span(t, LANDED, LANDED + 200));
      // The O opens on each hit and eases a little between them.
      const size = sing * (0.82 + 0.26 * Math.max(0, g.d) * (g.on ? g.a / g.on : 0));
      mouthO.setAttribute("rx", (2.3 * size).toFixed(2));
      mouthO.setAttribute("ry", (2.9 * size).toFixed(2));
      const w = lerp(5, lerp(6.4, 7.6, grin), beam), bend = lerp(0, lerp(1.9, 2.8, grin), beam);
      const cx = 22.5, cy = 33.6, lift = (cy - bend * 0.35).toFixed(2);
      mouthLine.setAttribute("d", `M${(cx - w / 2).toFixed(2)} ${lift}Q${cx} ${(cy + bend).toFixed(2)} ` +
        `${(cx + w / 2).toFixed(2)} ${lift}`);
      mouthLine.style.opacity = clamp(shown).toFixed(3);
    }

    // The tab in front is the last one opened, and the window types the command
    // that resumes it, in its own agent's words and colour.
    const front = SHOWN - 1;
    const typed = {codex: "codex resume", opencode: "opencode --session"}[opts.agents[front]] || "claude --resume";
    if (win) {
      win.style.setProperty("--accent", accent(front));
      screen.said.textContent = opts.names[front] || "";
    }
    const dealtAt = (slot) => T.launch + slot * DEAL;
    // Where a slot is in the scene, for the cards to land on and the eyes to find.
    const slotAt = (slot) => (win
      ? { x: box.x + Number(tabs[slot].dataset.cx), y: box.y + tabTop + tabH / 2 }
      : { x: Number(minis[slot].dataset.x), y: Number(minis[slot].dataset.y) });
    // A failed launch cuts the scene short: everything fades from wherever it is.
    let fadeFrom = END - 240;

    function render(t) {
      const out = 1 - ease(span(t, fadeFrom, fadeFrom + 240));
      veil.style.opacity = (ease(span(t, 0, 180)) * out).toFixed(3);
      floor.style.opacity = (span(t, 0, 90) * out).toFixed(3);

      // ── the figure ──
      const now = pose(t), was = pose(t - 60);
      const { g, hit, lift, tap, sway, hop, gy, rot } = now;
      mistAt(t, out, gy);
      // Pulled up fast it stretches a little, and it squashes as it drops back.
      const vy = (gy - was.gy) / 60;
      const stretch = Math.max(-0.03, Math.min(0.06, -vy * 0.08));
      // Faint while it is still in the mist, whole once it is out.
      const seen = span(t, RISE.from, RISE.from + 30) * lerp(0.12, 1, ease(span(t, RISE.from, RISE.from + 330)));
      figure.style.opacity = (seen * out).toFixed(3);
      figure.style.transform = `translate(${(ghost.x - ghost.size / 2 + sway).toFixed(2)}px, ` +
        `${(ghost.y - ghost.size / 2 + gy).toFixed(2)}px) rotate(${rot.toFixed(2)}deg) ` +
        `scale(${((1 + hit * 0.045 - lift * 0.02 + tap * 0.04) * (1 - stretch / 2)).toFixed(4)}, ` +
        `${((1 - hit * 0.055 + lift * 0.03 - tap * 0.04) * (1 + stretch)).toFixed(4)})`;
      // Below the floor it is not there yet, and for a good way above it
      // it is still mist: its lower half fades out into the mist rather than
      // being cut off, so its straight sides never show as an edge.
      if (t < RISE.to) {
        // The fade sinks away just before it comes off, so nothing pops.
        const cut = ghost.size * 0.86 + (floorY - (ghost.y - ghost.size / 2 + gy) - ghost.size * 0.86) / (1 + stretch) +
          span(t, RISE.to - 90, RISE.to) * 56;
        figure.style.webkitMaskImage = figure.style.maskImage =
          `linear-gradient(#000 ${(cut - 46).toFixed(1)}px, transparent ${(cut + 6).toFixed(1)}px)`;
      } else if (figure.style.maskImage) {
        figure.style.webkitMaskImage = figure.style.maskImage = "";
      }
      // The face lags the head by a few frames, so the figure reads as soft.
      const late = groove(t - 45);
      face.setAttribute("transform", `translate(${(g.side * g.d * g.a * 0.3).toFixed(2)} ` +
        `${(late.d * late.a * 0.9 + (hop / 8) * -0.6).toFixed(2)})`);
      // The sheet trails the head. Sideways its lower half lags the sway and
      // the tilt; up and down it streams out below a rise and billows out on a
      // drop. All in the drawing's units.
      const across = (q) => q.sway / UNIT + Math.sin((q.rot * Math.PI) / 180) * 30;
      const drag = Math.max(-1.3, Math.min(1.3, (across(was) - across(now)) * 0.5));
      const fall = (gy - was.gy) / UNIT;
      const flare = Math.max(-1, Math.min(0.9, fall * 0.22 + hit * 0.6));
      const stream = Math.max(0, Math.min(0.4, -fall * 0.03));
      drape(drag, flare);
      // A ripple runs along the hem after every hit, over a slow idle sway.
      // Each point swings and stretches from where it joins the body, so the
      // hem moves like cloth and never comes away from it; the outer points
      // go with the flare.
      peaks.forEach((peak, i) => {
        const idle = Math.sin(t / 240 - i * 0.9);
        const wake = span(g.p, 0.18, 0.3) * Math.exp(-3.2 * Math.max(0, g.p - 0.18)) *
          Math.sin((g.p - 0.18) * 11 - i * 0.8) * g.a;
        const [rx, ry] = roots[i];
        const out1 = peaks.length > 1 ? (i / (peaks.length - 1)) * 2 - 1 : 0;
        const hang = `translate(${n2(rx + drag + flare * out1)} ${ry}) ` +
          `skewX(${(idle * 5.5 + wake * 9 + drag * 4 + flare * out1 * 3).toFixed(2)}) ` +
          `scale(1 ${(1 + idle * 0.06 + wake * 0.16 + stream - Math.max(0, flare) * 0.08).toFixed(3)}) ` +
          `translate(${-rx} ${-ry})`;
        peak.setAttribute("transform", hang);
        if (i === peaks.length - 1 && tipShade) tipShade.setAttribute("transform", hang);
      });
      // Its shadow comes as it clears the floor.
      const grounded = span(t, RISE.to - 160, RISE.to + 40);
      shadow.style.opacity = ((0.55 + g.d * g.a * 0.12 + hop * 0.03) * grounded * out).toFixed(3);
      shadow.style.transform = `translate(${(under.x - 48 + sway).toFixed(2)}px, ${floorY - 7}px) ` +
        `scale(${(lerp(0.6, 1, grounded) + g.d * g.a * 0.07 + hop * 0.025).toFixed(3)}, 1)`;

      // Eyes: open to watch the deck gather, squeezed shut to feel the beat,
      // open again on the tap to follow each card to its slot, and shut once
      // more, pleased, when the last one lands.
      const happy = t >= LANDED + 40;
      const shut = (t >= T.split1 - 10 && t < T.square) || happy;
      // It comes up out of the ground asleep, and wakes as it clears the mist.
      const asleep = t < RISE.wake;
      bliss.style.display = shut ? "" : "none";
      let open = 1;
      // Waking: half open, a little too wide, and settled.
      if (t < RISE.wake + 240) {
        const w = span(t, RISE.wake, RISE.wake + 240);
        open = 0.5 + 0.5 * ease(span(w, 0, 0.4)) + 0.12 * arc(span(w, 0.3, 1));
      }
      if (t >= T.split1 - 50 && t < T.split1 - 10) open = lerp(1, 0.15, span(t, T.split1 - 50, T.split1 - 10));
      if (t >= T.square) open = lerp(0.15, 1, ease(span(t, T.square, T.square + 110)));
      if (t >= LANDED - 20 && t < LANDED + 40) open = lerp(1, 0.15, span(t, LANDED - 20, LANDED + 40));
      // Less than half open, an eye is a lid: squashed, it read as a sidelong
      // look rather than a closing one.
      const lidded = !shut && (asleep || open < 0.5);
      if ((sleep.style.display !== "none") !== lidded) sleep.style.display = lidded ? "" : "none";
      eyes.style.display = shut || lidded ? "none" : "";
      eyes.style.transform = `scaleY(${open.toFixed(3)})`;
      let lx = 2.4, ly = 1.1;
      if (t >= T.square) {
        const aim = slotAt(Math.max(0, Math.min(SHOWN - 1, Math.floor((t - T.launch) / DEAL))));
        const dx = aim.x - ghost.x, dy = aim.y - (ghost.y - 22), len = Math.hypot(dx, dy) || 1;
        const w = ease(span(t, T.square + 60, T.square + 260));
        lx = lerp(2.4, (dx / len) * 2.6, w);
        ly = lerp(1.1, (dy / len) * 2.2, w);
      }
      pupils.forEach((p, i) => {
        p.setAttribute("cx", ((i ? 29.6 : 15.4) + lx).toFixed(2));
        p.setAttribute("cy", (21.5 + ly).toFixed(2));
      });
      mouth(t, g);

      NOTES.forEach(([at, , dir], i) => {
        const pn = span(t, at, at + 900);
        notes[i].style.opacity = (arc(pn) * 0.8 * out).toFixed(3);
        notes[i].style.transform = `translate(${(ghost.x + 34 + dir * 6 + pn * 16 + Math.sin(pn * 6) * 3).toFixed(1)}px, ` +
          `${(ghost.y - 64 - pn * 48).toFixed(1)}px) rotate(${(dir * -10 + Math.sin(pn * 5) * 12).toFixed(1)}deg) ` +
          `scale(${lerp(0.7, 1, ease(pn)).toFixed(3)})`;
      });

      // ── the destination comes in on the tap: until then the shuffle has the stage ──
      const destIn = ease(span(t, T.square, T.square + 280));
      holes.forEach((hole, i) => {
        const filled = i < minis.length ? ease(span(t, dealtAt(i) + FLIGHT * 0.86, dealtAt(i) + FLIGHT + 80)) : 0;
        hole.style.opacity = (destIn * (1 - filled) * out).toFixed(3);
      });
      if (win) {
        win.style.opacity = (destIn * out).toFixed(3);
        win.style.transform = `translate(${box.x}px, ` +
          `${box.y + (1 - destIn) * 14}px) scale(${lerp(0.96, 1, destIn)})`;
      }

      // ── the cards ──
      const deckIn = ease(span(t, GATHER + 100, GATHER + 360));
      const square = ease(span(t, T.square - 80, T.square + 60));
      cards.forEach((card, id) => {
        const second = t >= T.split2;
        const p = second ? riffleCard(id, order1, order2, T.split2, T.riffle2, t)
                         : riffleCard(id, order0, order1, T.split1, T.riffle1, t);
        let x = p.x, y = p.y, r = p.r, skew = p.skew, sx = 1, sy = 1, o = deckIn, seed = 0, boot = 0;
        // A riffled pile is never square: each card lands a little off, and
        // the tap on the table knocks them straight again.
        const off1 = second ? 1 - p.ps : p.pd, off2 = second ? p.pd * (1 - square) : 0;
        x += jitter(id, 1) * 3 * off1 + jitter(id, 2) * 3 * off2;
        r += jitter(id, 3) * 2.6 * off1 + jitter(id, 4) * 2.6 * off2;
        const from0 = origin(id);
        if (from0) {
          // Gathered row by row, top to bottom: each mark lifts off its row,
          // unfolds into a terminal on the way and drops onto the deck.
          const g0 = GATHER + rank(id) * (90 / Math.max(1, SHOWN - 1));
          const pg = ease(span(t, g0, g0 + 170));
          o = 1;
          x = lerp(from0.x, x, pg);
          y = lerp(from0.y, y, pg) - arc(pg) * 30;
          r = lerp(0, r, pg) - arc(pg) * 6;
          sx = lerp(9 / CW, 1, pg);
          sy = lerp(9 / CH, 1, pg);
          seed = 1 - span(pg, 0.25, 0.8);
        } else if (t < GATHER + 360) {
          y += (1 - deckIn) * 18;
          sx = sy = lerp(0.72, 1, deckIn);
        }
        const seedOpacity = String(Math.round(seed * 100) / 100);
        if (card.firstChild.style.opacity !== seedOpacity) card.firstChild.style.opacity = seedOpacity;
        // Squared up: the stack compresses and lifts on the tap.
        if (t >= T.square && t < T.launch) y -= arc(span(t, T.square, T.launch)) * 4;

        const slot = rank(id);
        const go = dealtAt(slot);
        if (t >= go) {
          const pf = span(t, go, go + FLIGHT), pe = ease(pf);
          const from = stackPos(order2.indexOf(id));
          const aim = slotAt(slot);
          const tabbed = Boolean(win);
          const tsx = tabbed ? tabW / CW : MINI.w / CW, tsy = tabbed ? tabH / CH : MINI.h / CH;
          const tr = tabbed ? 0 : Number(minis[slot].dataset.r);
          // Dealt off the right edge of the deck, then thrown in an arc that
          // rises toward the viewer; on the way the screen wakes up, and on
          // arrival the card takes the shape of what it lands in.
          const slide = ease(span(t, go, go + 100));
          const lx0 = from.x + slide * 34, ly0 = from.y - slide * 6;
          const grow = 1 + arc(pe) * 0.12;
          x = lerp(lx0, aim.x, pe);
          y = lerp(ly0, aim.y, pe) - arc(pe) * 54;
          r = lerp(-5, tr, pe) + arc(pe) * 8;
          skew = -arc(span(pf, 0, 0.35)) * 4;
          sx = lerp(1, tsx, pe) * grow;
          sy = lerp(1, tsy, pe) * grow;
          boot = arc(span(pf, 0.1, 0.95)) * 0.5;
          o = tabbed ? 1 - span(pf, 0.8, 1) : 1 - span(pf, 0.9, 1);
        }
        card.style.opacity = (o * out).toFixed(3);
        card.style.transform = `translate(${(x - CW / 2).toFixed(1)}px, ${(y - CH / 2).toFixed(1)}px) ` +
          `rotate(${r.toFixed(2)}deg) skewX(${skew.toFixed(2)}deg) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
        const bootOpacity = String(Math.round(boot * 100) / 100);
        if (boots[id].style.opacity !== bootOpacity) boots[id].style.opacity = bootOpacity;
        const z = String(t >= go ? 60 + order2.length - order2.indexOf(id)
                                 : 20 + (second ? order2 : order1).indexOf(id));
        if (card.style.zIndex !== z) card.style.zIndex = z;
        // Its shadow on the floor: darker and tighter the lower it flies.
        const height = floorY - y;
        // Once dealt it leaves the floor behind: the grid it lands in is not on it.
        const grounded = t >= go ? 1 - span(t, go, go + FLIGHT * 0.5) : 1;
        const cast = clamp(1 - (height - 30) / 170) * span(t, GATHER + 180, GATHER + 300) * grounded * o * out;
        casts[id].style.opacity = (cast * 0.3).toFixed(3);
        casts[id].style.transform = `translate(${(x - 34).toFixed(1)}px, ${floorY - 5}px) ` +
          `scale(${(sx * lerp(1.1, 0.7, clamp(height / 220))).toFixed(3)}, 1)`;
      });

      // The flicks: one pair of ticks per card landing on the riffled pile,
      // on the side it fell from.
      ticks.forEach((tick, j) => {
        let shown = 0, tx = 0, ty = 0, side = 1;
        [[order0, order1, T.riffle1], [order1, order2, T.riffle2]].forEach(([before, after, tRiffle]) => {
          const half = Math.ceil(before.length / 2);
          for (let k1 = j; k1 < after.length; k1 += ticks.length) {
            const since = t - (tRiffle + k1 * stagger + 90);
            if (since >= 0 && since < 150) {
              shown = arc(since / 150);
              side = before.indexOf(after[k1]) < half ? -1 : 1;
              tx = deck.x + side * (CW / 2 + 7);
              ty = stackPos(k1).y - CH / 2 + 4;
            }
          }
        });
        tick.style.opacity = (shown * 0.55 * out).toFixed(3);
        tick.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) rotate(${side * 28}deg) ` +
          `scaleX(${lerp(0.4, 1, shown).toFixed(3)})`;
      });

      if (win) {
        // Classes and text change only when they have to: a write per frame
        // would restyle the window sixty times a second for nothing.
        tabs.forEach((tab, i) => {
          const go = dealtAt(i);
          const land = span(t, go + FLIGHT * 0.78, go + FLIGHT);
          const flash = land > 0 ? arc(span(t, go + FLIGHT * 0.78, go + FLIGHT + 180)) : 0;
          tab.firstChild.style.opacity = (flash * 0.45).toFixed(3);
          const live = land > 0;
          if (tab.classList.contains("sh-live") !== live) tab.classList.toggle("sh-live", live);
          // The last one opened is the one in front, as in a real terminal.
          const on = i === front && t >= LANDED;
          if (tab.classList.contains("sh-on") !== on) tab.classList.toggle("sh-on", on);
        });
        const chars = Math.floor(span(t, T.launch + 200, LANDED - 60) * typed.length);
        const shown = typed.slice(0, chars);
        if (screen.typed.textContent !== shown) screen.typed.textContent = shown;
        screen.said.style.opacity = (ease(span(t, LANDED - 60, LANDED + 180)) * out).toFixed(3);
      } else {
        minis.forEach((m, i) => {
          const go = dealtAt(i);
          const land = ease(span(t, go + FLIGHT * 0.86, go + FLIGHT + 80));
          m.style.opacity = (land * out).toFixed(3);
          m.style.transform = `translate(${Number(m.dataset.x) - MINI.w / 2}px, ` +
            `${Number(m.dataset.y) - MINI.h / 2}px) rotate(${m.dataset.r}deg) scale(${lerp(0.94, 1, land)})`;
        });
      }
    }

    // Driven by the page's frame clock, once through. The caller hears when the
    // launch should be asked for and when the scene is over, and can cut it short.
    const began = performance.now();
    const clock = (now) => (now - began) / PACE;
    let launched = false, done = false, stopAt = END;
    // The terminals come up on top of whatever is still moving, so the first
    // is asked for as the last card lands, and not before: `lead` is how long
    // this terminal's window takes to show after the call. The request goes
    // out a little earlier than that, with the rest of the wait in it, so the
    // service has time to check the sessions and the window is still on time.
    const LEAD = Math.max(0, Number(opts.lead) || 0);
    const firstAt = LANDED * PACE - LEAD;
    const launchAt = Math.max(T.launch, (firstAt - ASK_AHEAD) / PACE);

    // Moves the window the cards are dealt into to where the real one will open,
    // given in stage pixels. Too late once the window is on show, and then the
    // scene keeps its stand-in.
    function aim(spots, strip) {
      if (done || LAYOUT !== "tabs" || !win || !spots.length || box.real ||
          clock(performance.now()) > T.square - 20) {
        return false;
      }
      const s = spots[0];
      const band = strip / k;
      tabTop = Math.round(band * 0.2);
      tabH = band - tabTop;
      win.remove();
      box = { x: (s.x - ox) / k, y: s.y / k, w: s.width / k, h: s.height / k, real: true };
      win = frameOf(box.w, box.h, band, true);
      win.classList.add("sh-real");
      // The caption buttons and the new-tab button keep their end of the strip,
      // and the tabs stay on the part of it the stage shows: the window runs on
      // past the edge of the page.
      const shown = Math.max(60, (W - ox) / k - box.x - 20);
      tabsIn(win, { most: 120 / k, width: Math.min(box.w - 170 / k, shown) });
      win.style.setProperty("--accent", accent(front));
      screen.said.textContent = opts.names[front] || "";
      return true;
    }

    const finish = () => {
      if (done) return;
      done = true;
      host.innerHTML = "";
      if (opts.onEnd) opts.onEnd();
    };
    const frame = (now) => {
      if (done) return;
      // Motion switched off mid-deal, or a frame that throws, ends the scene
      // rather than leaving a veil over the register.
      if (stillness()) return finish();
      const t = clock(now);
      try {
        render(Math.min(t, END));
      } catch (e) {
        return finish();
      }
      if (!launched && t >= launchAt) {
        launched = true;
        if (opts.onLaunch) opts.onLaunch();
      }
      if (t >= stopAt) return finish();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);

    return {
      // render() takes scene time; END and LAUNCH are in real milliseconds.
      render,
      PACE,
      END: END * PACE,
      LAUNCH: launchAt * PACE,
      aim,
      // Where the scene keeps clear of, and where tab strips can be seen land,
      // in stage pixels: right of the figure and its notes, inside the stage.
      // The deck may be covered: it is empty by the time a window comes up.
      room: { right: ox + (ghost.x + 96) * k + 12, top: 8, bottom: H - 8 - 40 },
      // How long from now until the first terminal should be started; no
      // waiting once the scene is gone.
      wait: () => (done ? 0 : Math.max(0, began + firstAt - performance.now())),
      // A failed launch fades everything out from where it stands.
      fail() {
        fadeFrom = Math.min(fadeFrom, clock(performance.now()));
        stopAt = Math.min(stopAt, fadeFrom + 260);
      },
      stop: finish,
    };
  }

  // Lays the stage over the register and starts the scene. Resolves `launch`
  // when the cards are about to leave the deck, or after a timer if frames have
  // stopped (a hidden window gets none) or the scene never started at all.
  function deal(ids, corner) {
    const host = document.createElement("div");
    host.className = "sh-stage";
    host.setAttribute("aria-hidden", "true");
    // Kept over the register if the window changes size mid-deal: the scene
    // keeps its own size, and the veil goes on covering the rows.
    const fit = () => {
      const box = el.register.getBoundingClientRect();
      Object.assign(host.style, { left: `${box.left}px`, top: `${box.top}px`,
                                  width: `${box.width}px`, height: `${box.height}px` });
    };
    fit();
    addEventListener("resize", fit);
    let guard = 0, over;
    const ended = new Promise((resolve) => { over = resolve; });
    const clear = () => {
      clearTimeout(guard);
      removeEventListener("resize", fit);
      host.remove();
      over();
    };
    document.body.appendChild(host);
    // Said first, so the toast has its height when the scene measures the room.
    const count = say(ids.length).toLowerCase();
    word(drawn(layout) === "tabs"
      ? `Dealing ${count} sessions into one window. Esc to skip.`
      : `Dealing ${count} sessions into windows of their own. Esc to skip.`);
    const foot = el.word.parentElement.getBoundingClientRect().top - 10 - el.word.offsetHeight;
    const below = Math.max(0, el.register.getBoundingClientRect().bottom - foot + 8);
    const picked = ids.map((id) => sessions.find((s) => s.sessionId === id)).filter(Boolean);
    // Each card starts on the mark of its own row. Rows are measured by their
    // box, not the mark inside it, because content-visibility skips laying out
    // the insides of rows that are off screen; a row out of view sends its
    // card in from the nearer edge.
    const top = el.register.getBoundingClientRect().top, tall = el.register.clientHeight;
    const origins = picked.slice(0, 12).map((s) => {
      const node = el.rows.querySelector(`.row[data-id="${CSS.escape(s.sessionId)}"]`);
      if (!node) return null;
      const y = node.getBoundingClientRect().top - top + 17.5;
      return { x: 74, y: Math.max(-12, Math.min(tall + 12, y)) };
    });
    let show = null;
    const launch = new Promise((resolve) => {
      try {
        show = startShuffle(host, {
          count: ids.length,
          layout: drawn(layout),
          figure: SHUFFLE_FIGURE,
          agents: picked.map((s) => s.agent),
          names: picked.map((s) => s.label),
          origins,
          below,
          lead: (opens[drawn(layout)] || {}).lead,
          onLaunch: resolve,
          onEnd: clear,
        });
        setTimeout(resolve, show.LAUNCH + 400);
        // Frames stop in a hidden window; the scene leaves on time regardless.
        if (FRAME === null) guard = setTimeout(() => show.stop(), show.END + 1500);
      } catch (e) {
        clear();
        resolve();
      }
    });

    // Asks where the real window will open, so the cards can be thrown into its
    // tabs. In the page's own pixels, measured from the screen: the work area,
    // where the window may start clear of the figure, and the band its tab strip
    // has to land in to be seen. Windows of their own, a second screen, or no
    // answer in time, and the scene keeps its stand-in.
    let room = null;
    if (show && show.aim && corner && drawn(layout) === "tabs" && !screen.isExtended) {
      const box = host.getBoundingClientRect();
      const left = screen.availLeft || 0, top = screen.availTop || 0;
      const asked = {
        scale: devicePixelRatio,
        screen: [left, top, left + screen.availWidth, top + screen.availHeight],
        left: corner.x + box.left + show.room.right,
        top: corner.y + box.top + show.room.top,
        bottom: corner.y + box.top + show.room.bottom,
      };
      api("/api/place", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ layout: drawn(layout), room: asked }),
      }, 2000).then((answer) => {
        const spots = (answer && answer.spots) || [];
        const stage = spots.map((s) => ({ ...s, x: s.x - corner.x - box.left, y: s.y - corner.y - box.top }));
        if (show.aim(stage, answer.strip)) room = asked;
      }).catch(() => {});
    }
    return {
      launch,
      ended,
      fail: () => { if (show) show.fail(); },
      stop: () => { if (show) show.stop(); },
      // What the revival carries so its window opens where, and when, the cards
      // went: the room it was placed in and the wait before the launch.
      wish: () => ({ room, wait: Math.round(show ? show.wait() : 0) }),
      // One moment of the scene, in scene time, for the frozen frames.
      draw: (t) => { if (show) show.render(Math.min(t, show.END / show.PACE)); },
    };
  }

  // Deals what is marked and draws it frozen at `at`, the way a frame of the
  // recording is made. The scene's own clock never starts, there is no window
  // to place, and REVIVE is never pressed, so no terminal can open. A negative
  // moment leaves the list as it is before the click.
  function freeze(at) {
    if (!(at >= 0) || !chosen.size) return;
    window.requestAnimationFrame = () => 0;
    mist();
    deal([...chosen], null).draw(at);
  }

  // Where the page's top-left corner sits on the screen, in its own pixels:
  // exact from a pointer, and from the window's frame for a key press.
  const corner = (e) => (e && (e.screenX || e.clientX)
    ? { x: e.screenX - e.clientX, y: e.screenY - e.clientY }
    : { x: screenX + (outerWidth - innerWidth) / 2,
        y: screenY + (outerHeight - innerHeight) - (outerWidth - innerWidth) / 2 });

  // The terminals a revival opens come up on top and take focus, so whatever is
  // still animating when they start plays to nobody. The page shows the moment
  // first and asks for the launch after it: long enough for the last stamp to
  // land and its soul to lift, with the cascade squeezed so that twenty rows
  // take no longer to show than eight.
  const STAMP_FROM = 120;
  const STAMP_SPREAD = 600;
  const STAMP_SETTLE = 800;
  const stampEvery = (count) => (count > 1 ? Math.min(90, STAMP_SPREAD / (count - 1)) : 0);
  // Windows of their own are asked for one after another, dealt or stamped,
  // and after an Escape too. Started all at once, ten of them held even the
  // first back by over a second, filmed.
  const WINDOW_GAP = 110;

  // The lap a revival earns is owed until the window is looked at again, which
  // is after the new terminals, not behind them.
  let lapOwed = false;

  // A revival waiting for its moment. Escape skips the wait and the scene;
  // closing the window sends it first, since the terminals are what was asked
  // for and the scene is not.
  let revival = null;
  addEventListener("focus", () => {
    if (!lapOwed) return;
    lapOwed = false;
    setTimeout(() => run(agent), 250);
  });

  el.raise.addEventListener("click", async (event) => {
    // A second click or an Enter during the wait would launch the same sessions
    // twice, so a revival in flight ignores both.
    if (!chosen.size || el.raise.dataset.busy === "true") return;
    const ids = [...chosen];
    el.raise.dataset.busy = "true";
    el.raise.textContent = "RAISING";
    el.register.classList.add("raising");

    // What goes out is what was on screen at the click: the ruler, the agent
    // tab or the layout can all change during the wait.
    const sent = { ids, days: stop().days, agent, layout, stagger: drawn(layout) === "tabs" ? 0 : WINDOW_GAP };
    const every = stampEvery(ids.length);
    // More than five are dealt instead of stamped: past five, a column of stamps reads as a list.
    const dealt = ids.length >= SHUFFLE_FROM && !stillness();
    const show = dealt ? deal(ids, corner(event)) : null;
    const stampTimers = [];
    if (!document.documentElement.dataset.still && !dealt) {
      ids.forEach((id, i) => {
        const node = el.rows.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
        if (!node) return;
        stampTimers.push(setTimeout(() => {
          const stamp = document.createElement("span");
          stamp.className = "stamp";
          stamp.textContent = "RAISED";
          node.appendChild(stamp);

          // A row paints inside its own box (content-visibility keeps long lists
          // cheap), which would shear the soul off at the row's top edge. It lives
          // on the register instead, placed over its row, free to rise past it.
          const soul = document.createElement("span");
          soul.className = "soul";
          soul.innerHTML = FIGURE;
          soul.style.top = `${node.offsetTop + 12}px`;
          el.register.appendChild(soul);
          setTimeout(() => soul.remove(), 1600);
        }, STAMP_FROM + i * every));
      });
    }

    // Nothing to watch means nothing to wait for. A dealt revival asks for the
    // launch while its cards are still in the air, not after they land.
    const beat = stillness() ? 0 : STAMP_FROM + every * Math.max(0, ids.length - 1) + STAMP_SETTLE;
    let hurry, finished;
    const hurried = new Promise((resolve) => { hurry = resolve; });
    revival = {
      hurry: () => { hurry(); if (show) show.stop(); },
      done: new Promise((resolve) => { finished = resolve; }),
    };
    await Promise.race([show ? show.launch : new Promise((done) => setTimeout(done, beat)), hurried]);

    let result;
    try {
      result = await api("/api/revive", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(show ? { ...sent, ...show.wish() } : sent),
      }, 60000);
    } catch (e) {
      result = { ok: false, message: e && e.name === "AbortError"
        ? "The local service took too long to answer. Look for new terminals before trying again."
        : "The local service did not answer." };
    }

    setTimeout(() => el.register.classList.remove("raising"), 900);

    if (result.ok) {
      word(`${result.count} back from the dead. ${result.message || ""}`.trim());
      // They are running now. Left marked until the list reloads, a second click
      // could send them again before their new processes have registered as live.
      // Only what the service actually raised: it may have held some back as
      // running, dropped ones with no folder, or been sent only the first 200.
      for (const id of result.raised || ids) {
        chosen.delete(id);
        raised.set(id, Date.now());
        const node = el.rows.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
        if (node) {
          node.dataset.on = "false";
          node.setAttribute("aria-pressed", "false");
        }
      }
      repaintTally();
      // Paid now if the terminals left the window in front, as tmux or a second
      // monitor can; otherwise when it is next focused.
      // A deal still in the air keeps the masthead quiet until it has landed.
      lapOwed = true;
      (show ? show.ended : Promise.resolve()).then(() => setTimeout(() => {
        if (lapOwed && document.hasFocus()) {
          lapOwed = false;
          run(agent);
        }
      }, show ? 250 : 900));
      setTimeout(load, 1600);
    } else {
      if (show) show.fail();
      // A fast refusal can come back before every stamp has landed.
      stampTimers.forEach((timer) => clearTimeout(timer));
      el.rows.querySelectorAll(".stamp").forEach((node) => node.remove());
      word(result.message || "Nothing was raised.", true);
      repaintTally();
    }
    finished();
    // The answer comes while the last cards are still in the air. Until they
    // land the button stays busy and Escape stays a skip rather than a close.
    const mine = revival;
    (show ? show.ended : Promise.resolve()).then(() => {
      el.raise.dataset.busy = "false";
      if (revival === mine) revival = null;
      repaintTally();
    });
  });

  // ── window chrome ─────────────────────────────────────────────────────
  const native = () => (window.pywebview && window.pywebview.api) || null;
  $("hide").addEventListener("click", () => {
    const bridge = native();
    if (bridge && bridge.minimize) bridge.minimize();
  });
  $("shut").addEventListener("click", async () => {
    if (revival) {
      revival.hurry();
      await Promise.race([revival.done, new Promise((done) => setTimeout(done, 8000))]);
    }
    const bridge = native();
    if (bridge && bridge.destroy) return bridge.destroy();
    await api("/api/quit", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    window.close();
  });

  document.addEventListener("keydown", (event) => {
    // During a revival Escape skips the show; otherwise it closes, as ever.
    if (event.key === "Escape") {
      if (revival) revival.hurry();
      else $("shut").click();
    }
    if (event.key === "Enter" && event.target === document.body && !el.raise.disabled) el.raise.click();
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "r") {
      event.preventDefault();
      load();
    }
  });

  if (!params.get("still")) {
    setInterval(() => { api("/api/ping", {}, 4000).catch(() => {}); }, 5000);
  }

  if (PRESET !== null) {
    const wanted = Number(PRESET);
    if (Number.isFinite(wanted)) {
      let best = 0;
      STOPS.forEach((s, i) => {
        if (Math.abs(s.days - wanted) < Math.abs(STOPS[best].days - wanted)) best = i;
      });
      el.range.value = best;
    }
  }

  paintRuler();
  const loaded = load();
  if (FRAME !== null) loaded.then(() => freeze(Number(FRAME)));
  // The deal's mist, drawn a piece at a time while nothing else is happening,
  // and not at all for a reader who asked for less motion: they get no deal.
  const whenIdle = (fn) => (window.requestIdleCallback ? requestIdleCallback(fn, { timeout: 5000 })
                                                       : setTimeout(fn, 1500));
  const mistLater = () => {
    if (stillness() || mists.length >= MIST_PLAN.length) return;
    mists.push(paintMist(MIST_PLAN[mists.length]));
    whenIdle(mistLater);
  };
  whenIdle(mistLater);
})();
</script>
</body>
</html>
