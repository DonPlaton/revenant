<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1c1a18">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'self'">
<title>Revenant</title>
<style>
/* ── tokens ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#1c1a18; --ink:#eeeae1; --ink-2:#a9a297; --ink-3:#7a746b;
  --rule:#35322d; --rule-soft:#282521; --wash:#221f1c;
  --ember:#dd7b52; --ember-dim:rgba(221,123,82,.10); --ember-line:rgba(221,123,82,.42);
  --held:#8aa878; --codex:#79a6b8;

  --mono:"Cascadia Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;

  --ease:cubic-bezier(.2,.8,.2,1);
}

*{box-sizing:border-box}
html,body{height:100%}
html{color-scheme:dark}
body,button{touch-action:manipulation}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:13px/1.5 var(--mono); overflow:hidden; user-select:none;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(120% 62% at 12% -12%, rgba(221,123,82,.09), transparent 60%);
}
::selection{background:var(--ember-dim);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:1px solid var(--ember);outline-offset:2px}

/* ── masthead ───────────────────────────────────────────────────────────── */
.top{
  flex:0 0 40px; display:flex; align-items:center; gap:22px;
  padding:0 14px 0 22px; border-bottom:1px solid var(--rule);
}
.wordmark{font-family:var(--serif);font-size:15px;letter-spacing:.34em}
.tabs{display:flex;gap:18px;flex:1}
.tabs button{
  font-size:11px;letter-spacing:.1em;color:var(--ink-3);
  padding-bottom:2px;border-bottom:1px solid transparent;
  transition:color 140ms var(--ease);
}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-current=true]{color:var(--ink);border-bottom-color:var(--ember)}
.drag{flex:0 0 60px;height:100%}
.chrome{display:flex;gap:6px}
.chrome button{width:30px;height:24px;display:grid;place-items:center;color:var(--ink-3);
  transition:color 140ms var(--ease),background 140ms var(--ease)}
.chrome button:hover{color:var(--ink);background:var(--wash)}
.chrome button.shut:hover{background:#7d3f2c;color:#fff}

/* ── statement ──────────────────────────────────────────────────────────── */
.head{flex:0 0 auto;padding:20px 40px 0}
.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--ink-3);margin:0 0 11px}
.claim{font-family:var(--serif);font-size:28px;line-height:1.14;margin:0;font-weight:400}
.where{margin:9px 0 0;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}

/* ── the ruler ──────────────────────────────────────────────────────────── */
.ruler{flex:0 0 auto;padding:18px 40px 0}
.ruler-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
.ruler-top span:first-child{font-size:10px;letter-spacing:.2em;color:var(--ink-3)}
.span{font-family:var(--serif);font-size:16px}
.track{position:relative;height:26px}
.track .line{position:absolute;left:0;right:0;top:9px;height:1px;background:var(--rule)}
.track .lit{position:absolute;left:0;top:9px;height:1px;background:var(--ember);
  transition:width 220ms var(--ease)}
.track .ticks{position:absolute;left:0;right:0;top:4px;display:grid}
.track .ticks i{height:11px;border-left:1px solid var(--rule)}
.track .caret{position:absolute;top:0;width:3px;height:19px;margin-left:-1px;background:var(--ember);
  transition:left 220ms var(--ease)}
input[type=range]{position:relative;width:100%;height:26px;margin:0;background:none;cursor:ew-resize;
  -webkit-appearance:none;appearance:none;opacity:0}
.track:focus-within .line{background:var(--ember)}
.track:focus-within .caret{outline:1px solid var(--ember);outline-offset:2px}
.marks{display:grid;font-size:10px;letter-spacing:.08em;color:var(--ink-3);margin-top:3px}
.marks button{font:inherit;color:var(--ink-3);cursor:pointer;transition:color 140ms var(--ease);
  text-align:left;padding:2px 0}
.marks button:hover{color:var(--ink-2)}
.marks button[data-on=true]{color:var(--ember)}

/* ── the register ───────────────────────────────────────────────────────── */
.register{
  flex:1;min-height:0;margin:16px 40px 0;border-top:1px solid var(--rule);
  overflow-y:auto;overflow-x:hidden;position:relative;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
}
.register::-webkit-scrollbar{width:8px}
.register::-webkit-scrollbar-thumb{background:var(--rule)}
.axis{position:absolute;left:74px;top:0;bottom:0;width:1px;background:var(--rule)}

.row{
  position:relative;width:100%;display:grid;
  grid-template-columns:62px 24px minmax(0,1fr) 58px;align-items:start;
  padding:10px 0 11px;border-bottom:1px solid var(--rule-soft);
  transition:background 140ms var(--ease);
  content-visibility:auto;contain-intrinsic-size:auto 74px;
}
.row:hover:not([data-held=true]){background:linear-gradient(90deg,rgba(255,255,255,.03),transparent 40%)}
.row[data-on=true]{background:linear-gradient(90deg,var(--ember-dim),transparent 45%)}
.row[data-held=true]{opacity:.5;cursor:default}
.row.enter{animation:strike 260ms var(--ease) backwards}
@keyframes strike{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}

.age{text-align:right;padding-right:14px;font-size:11px;color:var(--ink-2)}
.row[data-held=true] .age{color:var(--ink-3)}
.mark{display:flex;justify-content:center;padding-top:3px}
.mark i{width:9px;height:9px;border:1px solid var(--ink-3);
  transition:background 140ms var(--ease),border-color 140ms var(--ease)}
.row[data-on=true] .mark i{background:var(--ember);border-color:var(--ember)}
.row[data-held=true] .mark i{border-color:var(--held);
  background:repeating-linear-gradient(45deg,var(--held) 0 1px,transparent 1px 3px)}

.body{padding-left:16px;min-width:0}
.name-line{display:flex;align-items:baseline;gap:11px}
.name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:9.5px;letter-spacing:.18em;color:var(--ink-3);flex:0 0 auto}
.who[data-agent=codex]{color:var(--codex)}
.flag{font-size:9.5px;letter-spacing:.18em;color:var(--held);flex:0 0 auto;white-space:nowrap}
.path{display:block;font-size:10.5px;color:var(--ink-3);margin-top:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.row:hover .path{color:var(--ink-2)}
.said{font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.4;color:var(--ink-2);
  margin-top:5px;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.turns{text-align:right;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* the sweep that runs down the register while sessions are being raised */
.sweep{position:absolute;left:0;right:0;top:0;height:38px;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,transparent,rgba(221,123,82,.20) 70%,var(--ember) 98%,transparent)}
.register.raising .sweep{opacity:1;animation:sweep 900ms steps(12,end) 1 forwards}
@keyframes sweep{from{transform:translateY(-38px)}to{transform:translateY(560px)}}
.stamp{position:absolute;right:2px;top:11px;font-family:var(--serif);font-size:11px;
  letter-spacing:.22em;color:var(--ember);border:1px solid var(--ember);padding:2px 7px;
  transform:rotate(-8deg);animation:stamp 300ms var(--ease) both}
@keyframes stamp{from{opacity:0;transform:scale(1.5) rotate(-8deg)}
                 to{opacity:1;transform:scale(1) rotate(-8deg)}}

/* ── states ─────────────────────────────────────────────────────────────── */
.blank{padding:56px 0 0 110px;max-width:52ch}
.blank p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink-2);
  text-wrap:pretty}
.blank small{display:block;margin-top:13px;font-family:var(--mono);font-size:11.5px;line-height:1.8;
  color:var(--ink-3)}
.ghost-rule{height:74px;border-bottom:1px solid var(--rule-soft)}
.loading .row{opacity:.35}

/* ── action bar ─────────────────────────────────────────────────────────── */
.bar{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:15px 40px 18px;
  border-top:1px solid var(--rule)}
.tally{flex:1;font-size:12px;color:var(--ink-2)}
.tally b{color:var(--ink);font-weight:500}
.plain{font-size:11.5px;color:var(--ink-2);border-bottom:1px solid var(--rule);padding-bottom:1px;
  transition:color 140ms var(--ease),border-color 140ms var(--ease)}
.plain:hover{color:var(--ink);border-bottom-color:var(--ember)}
.raise{
  background:var(--ember);color:#1c1a18;padding:11px 26px;font-size:12px;letter-spacing:.26em;
  font-weight:500;transition:background 140ms var(--ease),transform 90ms var(--ease);
}
.raise:hover:not(:disabled){background:#e88f68}
.raise:active:not(:disabled){transform:translateY(1px)}
.raise:disabled{background:transparent;color:var(--ink-3);border:1px solid var(--rule);
  padding:10px 25px;cursor:not-allowed}
.raise[data-busy=true]{background:transparent;color:var(--ember);border:1px solid var(--ember);
  padding:10px 25px}

/* ── word back from the app ─────────────────────────────────────────────── */
.said-back{position:fixed;left:40px;right:40px;bottom:62px;z-index:9;
  font-size:11.5px;color:var(--ink-2);border-left:2px solid var(--ember);padding:7px 12px;
  background:var(--wash);opacity:0;transform:translateY(6px);pointer-events:none;
  transition:opacity 200ms var(--ease),transform 200ms var(--ease)}
.said-back.up{opacity:1;transform:none}
.said-back.bad{border-left-color:#b4553a;color:#e8b6a4}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
                       transition-duration:.01ms!important}
}
html[data-still] .row{animation:none}
html[data-still] .sweep{display:none}
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;height:100%">

  <div class="top">
    <span class="wordmark">REVENANT</span>
    <div class="tabs" id="tabs"></div>
    <div class="drag pywebview-drag-region"></div>
    <div class="chrome">
      <button id="hide" title="Minimize" aria-label="Minimize">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true"><path d="M1 5.5h9" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="shut" class="shut" title="Close" aria-label="Close">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true"><path d="M1.5 1.5l8 8M9.5 1.5l-8 8" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </div>
  </div>

  <div class="head">
    <p class="eyebrow">REGISTER OF THE UNFINISHED</p>
    <h1 class="claim" id="claim">Reading the register…</h1>
    <p class="where" id="where"></p>
  </div>

  <div class="ruler">
    <div class="ruler-top"><span>LOOKING BACK</span><span class="span" id="span">seven days</span></div>
    <div class="track">
      <span class="line"></span>
      <span class="lit" id="lit"></span>
      <span class="ticks" id="ticks"></span>
      <span class="caret" id="caret"></span>
      <input type="range" id="range" min="0" max="6" step="1" value="3"
             aria-label="How far back to look" aria-valuetext="seven days">
    </div>
    <div class="marks" id="marks"></div>
  </div>

  <div class="register" id="register">
    <span class="axis"></span>
    <span class="sweep"></span>
    <div id="rows"></div>
  </div>

  <div class="bar">
    <span class="tally" id="tally"></span>
    <button class="plain" id="markall">mark all</button>
    <button class="plain" id="copy">copy commands</button>
    <button class="raise" id="raise" disabled>REVIVE</button>
  </div>
</div>

<div class="said-back" id="word" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  const params = new URLSearchParams(location.search);
  const TOKEN = params.get("t") || "";
  if (params.get("still")) document.documentElement.dataset.still = "1";
  const PRESET = params.get("days");

  const STOPS = [
    { days: 0.25, mark: "6h", said: "six hours" },
    { days: 1, mark: "1d", said: "one day" },
    { days: 3, mark: "3d", said: "three days" },
    { days: 7, mark: "7d", said: "seven days" },
    { days: 14, mark: "14d", said: "two weeks" },
    { days: 30, mark: "30d", said: "one month" },
    { days: 90, mark: "90d", said: "three months" },
  ];
  const WORDS = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine",
                 "Ten", "Eleven", "Twelve"];

  const $ = (id) => document.getElementById(id);
  const el = {
    range: $("range"), lit: $("lit"), caret: $("caret"), ticks: $("ticks"), marks: $("marks"),
    span: $("span"), rows: $("rows"), register: $("register"), claim: $("claim"), where: $("where"),
    tally: $("tally"), raise: $("raise"), word: $("word"), tabs: $("tabs"),
  };

  let sessions = [];
  let chosen = new Set();
  let agent = "";
  let seq = 0;

  const api = (path, options) =>
    fetch(path + (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN), options)
      .then((r) => r.json());

  const stop = () => STOPS[Number(el.range.value)];
  const say = (n) => WORDS[n] || String(n);
  const escape = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let wordTimer;
  function word(text, bad) {
    el.word.textContent = text;
    el.word.classList.toggle("bad", Boolean(bad));
    el.word.classList.add("up");
    clearTimeout(wordTimer);
    wordTimer = setTimeout(() => el.word.classList.remove("up"), 5200);
  }

  // ── the ruler ─────────────────────────────────────────────────────────
  el.ticks.style.gridTemplateColumns = `repeat(${STOPS.length}, minmax(0, 1fr))`;
  el.marks.style.gridTemplateColumns = `repeat(${STOPS.length}, minmax(0, 1fr))`;
  el.ticks.innerHTML = STOPS.map(() => "<i></i>").join("");
  el.marks.innerHTML = STOPS.map(
    (s, i) => `<button type="button" data-i="${i}" aria-label="Look back ${s.said}">${s.mark}</button>`
  ).join("");
  el.marks.addEventListener("click", (event) => {
    const target = event.target.closest("[data-i]");
    if (!target) return;
    el.range.value = target.dataset.i;
    paintRuler();
    load();
  });

  function paintRuler() {
    const index = Number(el.range.value);
    const ratio = index / (STOPS.length - 1);
    el.lit.style.width = `${ratio * 100}%`;
    el.caret.style.left = `${ratio * 100}%`;
    el.span.textContent = stop().said;
    el.range.setAttribute("aria-valuetext", stop().said);
    for (const node of el.marks.children) {
      node.dataset.on = String(Number(node.dataset.i) === index);
    }
  }

  let hold;
  el.range.addEventListener("input", () => {
    paintRuler();
    clearTimeout(hold);
    hold = setTimeout(load, 190);
  });

  // ── data ──────────────────────────────────────────────────────────────
  async function load() {
    const mine = ++seq;
    el.register.classList.add("loading");
    let data;
    try {
      data = await api(`/api/sessions?days=${stop().days}${agent ? "&agent=" + agent : ""}`);
    } catch {
      if (mine !== seq) return;
      // Leaving the loading class on would dim the register for good, including
      // every row a later reload paints under it.
      el.register.classList.remove("loading");
      el.claim.textContent = "The local service stopped answering.";
      el.rows.innerHTML = "";
      return;
    }
    if (mine !== seq) return;
    el.register.classList.remove("loading");

    paintTabs(data.agents || [], data.agent);
    if (data.error) {
      el.claim.textContent = "Nothing to read.";
      el.where.textContent = data.error;
      sessions = [];
      chosen.clear();
      paint();
      return;
    }

    el.where.textContent = document.documentElement.dataset.still
      ? "Reading transcripts in ~/.claude"
      : `Reading transcripts in ${data.root}`;

    const all = data.sessions || [];
    sessions = [...all.filter((s) => !s.live), ...all.filter((s) => s.live)];
    chosen = new Set(sessions.filter((s) => !s.live).map((s) => s.sessionId));
    paint();
  }

  function paintTabs(list, current) {
    agent = current || agent;
    if (!list.length) {
      el.tabs.innerHTML = "";
      return;
    }
    el.tabs.innerHTML = list
      .map((a) => `<button type="button" data-key="${escape(a.key)}" aria-current="${a.key === current}"
                     title="${escape(a.note || "")}">${escape(a.label.toUpperCase())}</button>`)
      .join("");
    el.tabs.querySelectorAll("button").forEach((node) => {
      node.addEventListener("click", () => {
        if (node.dataset.key === agent) return;
        agent = node.dataset.key;
        load();
      });
    });
  }

  function paint() {
    const open = sessions.filter((s) => !s.live);
    const held = sessions.length - open.length;

    // Count what can actually be raised: saying "eight outlived their terminals"
    // when all eight are still running reads as a lie.
    if (!sessions.length) {
      el.claim.textContent = `Nothing in the last ${stop().said}.`;
    } else if (!open.length) {
      el.claim.textContent = `${say(held)} session${held === 1 ? " is" : "s are"} still running.`;
    } else {
      el.claim.textContent = `${say(open.length)} session${open.length === 1 ? "" : "s"} outlived ` +
        `${open.length === 1 ? "its terminal" : "their terminals"}.`;
    }

    if (!sessions.length) {
      el.rows.innerHTML = `
        <div class="ghost-rule"></div><div class="ghost-rule"></div><div class="ghost-rule"></div>
        <div class="blank">
          <p>Every session in this window is still running, or there were none to begin with.</p>
          <small>Drag the caret right to look further back.<br>
                 Nothing here is deleted. Transcripts keep for as long as your agent keeps them.</small>
        </div>`;
    } else {
      const many = new Set(sessions.map((s) => s.agent)).size > 1;
      el.rows.innerHTML = sessions.map((s, i) => row(s, i, many)).join("");
      el.rows.querySelectorAll(".row").forEach((node) => {
        if (node.dataset.held === "true") return;
        node.addEventListener("click", () => toggle(node.dataset.id));
        node.addEventListener("dblclick", () => reveal(node));
        node.addEventListener("keydown", (event) => {
          if (event.key.toLowerCase() === "o") {
            event.preventDefault();
            reveal(node);
          }
        });
      });
    }
    paintTally(open.length, held);
  }

  function reveal(node) {
    api("/api/reveal", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: node.dataset.path }),
    }).then((r) => { if (!r.ok) word(r.message || "That folder is gone.", true); });
  }

  function row(s, index, many) {
    const on = chosen.has(s.sessionId);
    const turns = s.turns == null ? "" : s.turns;
    const who = many
      ? `<span class="who" data-agent="${escape(s.agent)}">${escape((s.agentLabel || "").toUpperCase())}</span>`
      : "";
    const flag = s.live
      ? `<span class="flag">HELD, ${escape((s.liveReason || "").toUpperCase())}</span>`
      : "";
    const said = s.live
      ? ""
      : `<span class="said">${escape(s.lastPrompt || s.firstPrompt || "")}</span>`;
    return `<button class="row enter" type="button" data-id="${escape(s.sessionId)}"
        data-on="${on}" data-held="${Boolean(s.live)}" data-path="${escape(s.cwd || "")}"
        aria-pressed="${on}" ${s.live ? "disabled" : ""}
        title="Click to mark. Double click, or press O, to open the folder."
        style="animation-delay:${Math.min(index * 26, 320)}ms">
      <span class="age">${escape(s.ageLabel || "")}</span>
      <span class="mark"><i></i></span>
      <span class="body">
        <span class="name-line">
          <span class="name">${escape(s.label)}</span>${who}${flag}
        </span>
        <span class="path" title="${escape(s.cwd || "directory unknown")}">${escape(s.cwd || "directory unknown")}</span>
        ${said}
      </span>
      <span class="turns">${turns}</span>
    </button>`;
  }

  function toggle(id) {
    if (chosen.has(id)) chosen.delete(id);
    else chosen.add(id);
    const node = el.rows.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
    if (node) {
      node.dataset.on = String(chosen.has(id));
      node.setAttribute("aria-pressed", node.dataset.on);
    }
    repaintTally();
  }

  function repaintTally() {
    const open = sessions.filter((s) => !s.live).length;
    paintTally(open, sessions.length - open);
  }

  function paintTally(open, held) {
    const n = chosen.size;
    const heldWord = held ? ` ${held} held back.` : "";
    el.tally.innerHTML = open
      ? `<b>${n}</b> of ${open} marked.${heldWord} Double click a row to open its folder.`
      : (held ? `${held} held back, nothing to raise.` : "Nothing to raise.");
    el.raise.disabled = n === 0;
    el.raise.textContent = n ? `REVIVE ${n}` : "REVIVE";
  }

  // ── actions ───────────────────────────────────────────────────────────
  $("markall").addEventListener("click", () => {
    const open = sessions.filter((s) => !s.live);
    if (chosen.size === open.length) chosen.clear();
    else open.forEach((s) => chosen.add(s.sessionId));
    paint();
  });

  $("copy").addEventListener("click", async () => {
    if (!chosen.size) return word("Mark a session first.");
    const data = await api("/api/commands", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids: [...chosen], days: stop().days, agent }),
    });
    try {
      await navigator.clipboard.writeText(data.text);
    } catch {
      const scratch = document.createElement("textarea");
      scratch.value = data.text;
      document.body.appendChild(scratch);
      scratch.select();
      document.execCommand("copy");
      scratch.remove();
    }
    word(`${data.count} command pair${data.count === 1 ? "" : "s"} on the clipboard.`);
  });

  el.raise.addEventListener("click", async () => {
    if (!chosen.size) return;
    const ids = [...chosen];
    el.raise.dataset.busy = "true";
    el.raise.textContent = "RAISING";
    el.register.classList.add("raising");

    if (!document.documentElement.dataset.still) {
      ids.forEach((id, i) => {
        const node = el.rows.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
        if (!node) return;
        setTimeout(() => {
          const stamp = document.createElement("span");
          stamp.className = "stamp";
          stamp.textContent = "RAISED";
          node.appendChild(stamp);
        }, 120 + i * 90);
      });
    }

    let result;
    try {
      result = await api("/api/revive", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids, days: stop().days, agent }),
      });
    } catch {
      result = { ok: false, message: "The local service did not answer." };
    }

    el.raise.dataset.busy = "false";
    setTimeout(() => el.register.classList.remove("raising"), 900);

    if (result.ok) {
      word(`${result.count} back from the dead. ${result.message || ""}`.trim());
      setTimeout(load, 1600);
    } else {
      el.rows.querySelectorAll(".stamp").forEach((node) => node.remove());
      word(result.message || "Nothing was raised.", true);
      repaintTally();
    }
  });

  // ── window chrome ─────────────────────────────────────────────────────
  const native = () => (window.pywebview && window.pywebview.api) || null;
  $("hide").addEventListener("click", () => {
    const bridge = native();
    if (bridge && bridge.minimize) bridge.minimize();
  });
  $("shut").addEventListener("click", async () => {
    const bridge = native();
    if (bridge && bridge.destroy) return bridge.destroy();
    await api("/api/quit", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    window.close();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") $("shut").click();
    if (event.key === "Enter" && event.target === document.body && !el.raise.disabled) el.raise.click();
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "r") {
      event.preventDefault();
      load();
    }
  });

  if (!params.get("still")) {
    setInterval(() => { api("/api/ping").catch(() => {}); }, 5000);
  }

  if (PRESET !== null) {
    const wanted = Number(PRESET);
    if (Number.isFinite(wanted)) {
      let best = 0;
      STOPS.forEach((s, i) => {
        if (Math.abs(s.days - wanted) < Math.abs(STOPS[best].days - wanted)) best = i;
      });
      el.range.value = best;
    }
  }

  paintRuler();
  load();
})();
</script>
</body>
</html>
