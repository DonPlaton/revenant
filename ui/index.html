<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1c1a18">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'self'">
<title>Revenant</title>
<style>
/* ── tokens ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#1c1a18; --ink:#eeeae1; --ink-2:#a9a297; --ink-3:#7a746b;
  --rule:#35322d; --rule-soft:#282521; --wash:#221f1c;
  --ember:#dd7b52; --ember-dim:rgba(221,123,82,.10); --ember-line:rgba(221,123,82,.42);
  --held:#8aa878; --codex:#79a6b8;

  --mono:"Cascadia Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;

  --ease:cubic-bezier(.2,.8,.2,1);
}

*{box-sizing:border-box}
html,body{height:100%}
html{color-scheme:dark}
body,button{touch-action:manipulation}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:13px/1.5 var(--mono); overflow:hidden; user-select:none;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(120% 62% at 12% -12%, rgba(221,123,82,.09), transparent 60%);
}
::selection{background:var(--ember-dim);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:1px solid var(--ember);outline-offset:2px}

/* ── masthead ───────────────────────────────────────────────────────────── */
.top{
  flex:0 0 40px; display:flex; align-items:center; gap:22px;
  padding:0 14px 0 40px; border-bottom:1px solid var(--rule);
}
.wordmark{font-family:var(--serif);font-size:15px;letter-spacing:.34em;cursor:pointer}
/* A name like this one has earned a bad connection. */
.wordmark:hover{animation:gutter 820ms steps(1,end) 1}
@keyframes gutter{
  0%,100%{opacity:1}
  9%{opacity:.24}
  15%{opacity:1}
  21%{opacity:.24}
  27%{opacity:1}
  58%{opacity:.5}
  64%{opacity:1}
}
.tabs{display:flex;gap:18px;flex:0 0 auto}
.tabs button{
  position:relative;font-size:11px;letter-spacing:.1em;color:var(--ink-3);
  padding-bottom:3px;transition:color 140ms var(--ease);
}
/* The rule stops an em-tenth short so it ends under the last glyph rather than
   under the letter-space trailing it. */
.tabs button::after{content:"";position:absolute;left:0;right:.1em;bottom:0;height:1px;
  background:transparent;transition:background 140ms var(--ease)}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-current=true]{color:var(--ink)}
.tabs button[aria-current=true]::after{background:var(--ember)}
/* ── the cast ───────────────────────────────────────────────────────────── */
/* One drawing, five places. The horizontal travel is the only thing script
   touches; every part that gives the figure life is a keyframe on its own
   clock, which is what keeps it from reading as a sliding cut-out. */
.rev{display:block;height:100%;width:auto;overflow:visible;color:var(--ember)}
.rev .body,.rev .peak{fill:currentColor}
.rev .peak{transform-box:fill-box;transform-origin:center top;
  animation:hem 620ms var(--ease) infinite alternate}
.rev .peak:nth-child(2){animation-delay:80ms}
.rev .peak:nth-child(3){animation-delay:160ms}
.rev .peak:nth-child(4){animation-delay:240ms}
.rev .peak:nth-child(5){animation-delay:320ms}
@keyframes hem{from{transform:scaleY(1)}to{transform:scaleY(.55)}}
.rev .shade{fill:#000;opacity:.16}
.rev .sheen{fill:#fff;opacity:.22}
.rev .sclera{fill:#f4efe6}
.rev .pupil{fill:#191715}
.rev .eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.4s step-end infinite}
@keyframes blink{0%,92%{transform:scaleY(1)}94%,97%{transform:scaleY(.12)}98%,100%{transform:scaleY(1)}}
.rev .mouth{fill:#191715;opacity:.85;transform-box:fill-box;transform-origin:center;
  animation:gasp 900ms var(--ease) infinite alternate}
@keyframes gasp{from{transform:scale(1)}to{transform:scale(.7,1.25)}}
.rev .streak{stroke:currentColor;stroke-linecap:round;fill:none;
  transform-box:fill-box;transform-origin:left center;animation:streak 520ms linear infinite}
.rev .streak:nth-of-type(2){animation-delay:170ms}
.rev .streak:nth-of-type(3){animation-delay:340ms}
@keyframes streak{
  0%{transform:translateX(-5px) scaleX(.45);opacity:.72}
  100%{transform:translateX(8px) scaleX(1.35);opacity:0}
}

/* The pursuer is a block cursor with bracket jaws, hinged at its trailing edge. */
.pur{display:block;height:100%;width:auto;overflow:visible;color:var(--codex)}
.pur .jaw{fill:currentColor;transform-box:view-box}
.pur .up{transform-origin:35px 20px;animation:bite 210ms var(--ease) infinite alternate}
.pur .lo{transform-origin:35px 20px;animation:bite-lo 210ms var(--ease) infinite alternate}
@keyframes bite{from{transform:rotate(1deg)}to{transform:rotate(15deg)}}
@keyframes bite-lo{from{transform:rotate(-1deg)}to{transform:rotate(-15deg)}}
.pur .gloss{fill:#fff;opacity:.22}
.pur .eye{fill:#15211f}
.pur .wake{stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;
  animation:wake 460ms linear infinite}
.pur .wake:nth-of-type(2){animation-delay:230ms}
@keyframes wake{0%{transform:translateX(0);opacity:.45}100%{transform:translateX(11px);opacity:0}}

/* The empty stretch of the masthead. It drags the window, and now and then
   something runs across it. */
.lane{flex:1;position:relative;height:100%;overflow:hidden}
.runner,.hunter,.crumb{position:absolute;pointer-events:none}
.runner{top:8px;left:0;height:24px}
.hunter{top:9px;left:0;height:22px}
.crumb{top:19px;width:3px;height:3px;background:var(--ink-3);
  animation:drop 180ms var(--ease) backwards}
@keyframes drop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
/* Transform and opacity only, so a swallowed crumb never repaints. */
.crumb.gone{background:var(--codex);animation:swallow 200ms var(--ease) forwards}
@keyframes swallow{to{transform:scale(2.4);opacity:0}}
/* Whoever swallowed it flashes its own colour. */
.crumb.gone.warm{background:var(--ember)}
/* Chasing rather than fled: the pupils come forward off the back wall of the eye. */
.runner.ahead .pupil{transform:translateX(-4.6px)}
/* The pair travel the other way round in the combined view. */
.runner.rightward,.hunter.rightward{transform-origin:center}
.runner.rightward .rev,.hunter.rightward .pur{transform:scaleX(-1)}
.lane .spark{top:16px}
.chrome{display:flex;gap:6px}
.chrome button{width:30px;height:24px;display:grid;place-items:center;color:var(--ink-3);
  transition:color 140ms var(--ease),background 140ms var(--ease)}
.chrome button:hover{color:var(--ink);background:var(--wash)}
.chrome button.shut:hover{background:#7d3f2c;color:#fff}

/* ── statement ──────────────────────────────────────────────────────────── */
.head{flex:0 0 auto;padding:20px 40px 0}
.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--ink-3);margin:0 0 11px}
.claim{font-family:var(--serif);font-size:28px;line-height:1.14;margin:0;font-weight:400}
.claim[data-typing=true]::after{content:"";display:inline-block;width:.42em;height:.82em;
  margin-left:.1em;vertical-align:-.05em;background:var(--ember);
  animation:pulse 1s steps(1,end) infinite}
@keyframes pulse{0%,55%{opacity:1}56%,100%{opacity:0}}
.where{margin:9px 0 0;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}

/* ── the ruler ──────────────────────────────────────────────────────────── */
.ruler{flex:0 0 auto;padding:18px 40px 0}
.ruler-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
.ruler-top span:first-child{font-size:10px;letter-spacing:.2em;color:var(--ink-3)}
.span{font-family:var(--serif);font-size:16px}
.track{position:relative;height:26px}
.track .line{position:absolute;left:0;right:0;top:9px;height:1px;background:var(--rule)}
.track .lit{position:absolute;left:0;top:9px;height:1px;background:var(--ember);
  transition:width 220ms var(--ease)}
.track .ticks{position:absolute;left:0;right:0;top:4px;height:11px}
/* Every mark on this track reads its position from the same fraction the caret
   uses, so a tick and the caret that lands on it agree to the pixel. */
.track .ticks i{position:absolute;top:0;height:11px;margin-left:-.5px;
  border-left:1px solid var(--rule)}
.track .caret{position:absolute;top:0;width:3px;height:19px;margin-left:-1.5px;background:var(--ember);
  transition:left 220ms var(--ease)}
input[type=range]{position:relative;width:100%;height:26px;margin:0;background:none;cursor:ew-resize;
  -webkit-appearance:none;appearance:none;opacity:0}
/* A wide thumb would inset its own travel by half its width at each end and
   drift away from the caret. A hairline thumb travels the full track. */
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1px;height:26px}
input[type=range]::-moz-range-thumb{width:1px;height:26px;border:0}
.track:focus-within .line{background:var(--ember)}
.track:focus-within .caret{outline:1px solid var(--ember);outline-offset:2px}
.spark{position:absolute;top:7px;width:2px;height:2px;background:var(--ember);
  pointer-events:none;animation:spark 620ms var(--ease) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.marks{position:relative;height:17px;font-size:10px;letter-spacing:.08em;color:var(--ink-3);
  margin-top:3px}
.marks button{position:absolute;top:0;font:inherit;color:var(--ink-3);cursor:pointer;
  transition:color 140ms var(--ease);white-space:nowrap;padding:2px 0}
.marks button:hover{color:var(--ink-2)}
.marks button[data-on=true]{color:var(--ember)}

/* ── the register ───────────────────────────────────────────────────────── */
.register{
  flex:1;min-height:0;margin:16px 40px 0;border-top:1px solid var(--rule);
  overflow-y:auto;overflow-x:hidden;position:relative;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
  /* Painted as a local background so the axis runs the whole scroll height
     rather than the height of the window. */
  background:linear-gradient(var(--rule),var(--rule)) 74px 0/1px 100% no-repeat local;
}
.register::-webkit-scrollbar{width:8px}
.register::-webkit-scrollbar-thumb{background:var(--rule)}
/* Rows dissolve into the bar instead of being sheared off by it, and only while
   there is something below to scroll to. */
.register[data-more=true]{
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 34px),transparent);
          mask-image:linear-gradient(180deg,#000 calc(100% - 34px),transparent);
}

.row{
  position:relative;width:100%;display:grid;
  grid-template-columns:62px 24px minmax(0,1fr) 58px;align-items:start;
  padding:10px 0 11px;border-bottom:1px solid var(--rule-soft);
  transition:background 140ms var(--ease);
  content-visibility:auto;contain-intrinsic-size:auto 74px;
}
.row:hover:not([data-held=true]){background:linear-gradient(90deg,rgba(255,255,255,.03),transparent 40%)}
.row[data-on=true]{background:linear-gradient(90deg,var(--ember-dim),transparent 45%)}
.row[data-held=true]{opacity:.5;cursor:default}
.row.enter{animation:strike 260ms var(--ease) backwards}
@keyframes strike{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}

.age{text-align:right;padding-right:14px;font-size:11px;color:var(--ink-2)}
.row[data-held=true] .age{color:var(--ink-3)}
.mark{display:flex;justify-content:center;padding-top:3px}
.mark i{width:9px;height:9px;border:1px solid var(--ink-3);
  transition:background 140ms var(--ease),border-color 140ms var(--ease)}
.row[data-on=true] .mark i{background:var(--ember);border-color:var(--ember)}
.row[data-held=true] .mark i{border-color:var(--held);
  background:repeating-linear-gradient(45deg,var(--held) 0 1px,transparent 1px 3px)}

.body{padding-left:16px;min-width:0}
.name-line{display:flex;align-items:baseline;gap:11px}
.name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:9.5px;letter-spacing:.18em;color:var(--ink-3);flex:0 0 auto}
.who[data-agent=codex]{color:var(--codex)}
.flag{font-size:9.5px;letter-spacing:.18em;color:var(--held);flex:0 0 auto;white-space:nowrap}
.path{display:block;font-size:10.5px;color:var(--ink-3);margin-top:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.row:hover .path{color:var(--ink-2)}
.said{font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.4;color:var(--ink-2);
  margin-top:5px;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.turns{text-align:right;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* the sweep that runs down the register while sessions are being raised */
.sweep{position:absolute;left:0;right:0;top:0;height:38px;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,transparent,rgba(221,123,82,.20) 70%,var(--ember) 98%,transparent)}
.register.raising .sweep{opacity:1;animation:sweep 900ms steps(12,end) 1 forwards}
@keyframes sweep{from{transform:translateY(-38px)}to{transform:translateY(560px)}}
.soul{position:absolute;right:64px;top:12px;height:16px;pointer-events:none;
  animation:ascend 1.5s var(--ease) forwards}
@keyframes ascend{
  0%{opacity:0;transform:translateY(8px) scale(.55)}
  22%{opacity:.95}
  100%{opacity:0;transform:translateY(-52px) scale(1.1)}
}
.stamp{position:absolute;right:2px;top:11px;font-family:var(--serif);font-size:11px;
  letter-spacing:.22em;color:var(--ember);border:1px solid var(--ember);padding:2px 7px;
  transform:rotate(-8deg);animation:stamp 300ms var(--ease) both}
@keyframes stamp{from{opacity:0;transform:scale(1.5) rotate(-8deg)}
                 to{opacity:1;transform:scale(1) rotate(-8deg)}}

/* ── states ─────────────────────────────────────────────────────────────── */
.blank{padding:56px 0 0 110px;max-width:52ch}
.blank{position:relative}
.blank .pale{display:block;height:44px;margin:0 0 18px;color:var(--ember);opacity:.46;
  animation:hover 5.5s ease-in-out infinite alternate}
.blank .pale .streak{display:none}
.blank .pale .mouth{animation:none}
/* Standing still on a page left open, so the hem idles rather than races. */
.blank .pale .peak{animation-duration:2.4s}
@keyframes hover{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.mote{position:absolute;width:2.5px;height:2.5px;border-radius:50%;background:var(--ember);
  opacity:0;animation:rise 7s linear infinite}
@keyframes rise{
  0%{opacity:0;transform:translateY(0)}
  14%{opacity:.6}
  70%{opacity:.34}
  100%{opacity:0;transform:translateY(-96px)}
}
.blank p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink-2);
  text-wrap:pretty}
.blank small{display:block;margin-top:13px;font-family:var(--mono);font-size:11.5px;line-height:1.8;
  color:var(--ink-3)}
.ghost-rule{height:74px;border-bottom:1px solid var(--rule-soft)}
.loading .row{opacity:.35}

/* ── action bar ─────────────────────────────────────────────────────────── */
.bar{position:relative;flex:0 0 auto;display:flex;align-items:center;
  height:64px;padding:0 40px;border-top:1px solid var(--rule)}
/* One line, always. The count truncates before the bar is allowed to grow a
   second row and shove the register up. */
.tally{flex:1;min-width:0;font-size:12px;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tally b{color:var(--ink);font-weight:500}
.hint{color:var(--ink-3)}
@media (max-width:1230px){.hint{display:none}}
.plain{flex:0 0 auto;margin-left:20px;font-size:11.5px;color:var(--ink-2);
  border-bottom:1px solid var(--rule);padding-bottom:1px;
  transition:color 140ms var(--ease),border-color 140ms var(--ease)}
.plain:hover{color:var(--ink);border-bottom-color:var(--ember)}
.mode{display:flex;align-items:baseline;gap:10px;flex:0 0 auto;margin-left:34px}
.mode-label{font-size:10px;letter-spacing:.16em;color:var(--ink-3);white-space:nowrap}
/* The masthead marks the live tab with a lit hairline and the ruler lights the
   span you picked. A third box would have been a fourth idiom, so the switch
   borrows the same one. */
.segs{display:flex;border-bottom:1px solid var(--rule)}
.seg{position:relative;font-size:11px;letter-spacing:.05em;color:var(--ink-3);
  padding:3px 9px 5px;white-space:nowrap;transition:color 140ms var(--ease)}
.seg::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:transparent;transition:background 160ms var(--ease)}
.seg:hover{color:var(--ink-2)}
.seg[aria-pressed=true]{color:var(--ink)}
.seg[aria-pressed=true]::after{background:var(--ember)}
@media (max-width:820px){.mode-label{display:none}}
.raise{
  flex:0 0 auto;margin-left:24px;min-width:152px;text-align:center;text-indent:.26em;
  background:var(--ember);color:#1c1a18;padding:11px 26px;font-size:12px;letter-spacing:.26em;
  font-weight:500;transition:background 140ms var(--ease),transform 90ms var(--ease);
}
.raise:hover:not(:disabled){background:#e88f68}
.raise:active:not(:disabled){transform:translateY(1px)}
.raise:disabled{background:transparent;color:var(--ink-3);border:1px solid var(--rule);
  padding:10px 25px;cursor:not-allowed}
.raise[data-busy=true]{background:transparent;color:var(--ember);border:1px solid var(--ember);
  padding:10px 25px}

/* ── word back from the app ─────────────────────────────────────────────── */
.said-back{position:absolute;left:40px;right:40px;bottom:calc(100% + 10px);z-index:9;
  font-size:11.5px;color:var(--ink-2);border-left:2px solid var(--ember);padding:7px 12px;
  background:var(--wash);opacity:0;transform:translateY(6px);pointer-events:none;
  transition:opacity 200ms var(--ease),transform 200ms var(--ease)}
.said-back.up{opacity:1;transform:none}
.said-back.bad{border-left-color:#b4553a;color:#e8b6a4}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
                       transition-duration:.01ms!important}
}
html[data-still] .row{animation:none}
html[data-still] .sweep{display:none}
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;height:100%">

  <div class="top">
    <span class="wordmark" id="wordmark" title="Give them a run">REVENANT</span>
    <div class="tabs" id="tabs"></div>
    <span class="lane pywebview-drag-region" id="lane" aria-hidden="true"></span>
    <div class="chrome">
      <button id="hide" title="Minimize" aria-label="Minimize">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true"><path d="M1 5.5h9" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="shut" class="shut" title="Close" aria-label="Close">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true"><path d="M1.5 1.5l8 8M9.5 1.5l-8 8" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </div>
  </div>

  <div class="head">
    <p class="eyebrow">REGISTER OF THE UNFINISHED</p>
    <h1 class="claim" id="claim">Reading the register…</h1>
    <p class="where" id="where"></p>
  </div>

  <div class="ruler">
    <div class="ruler-top"><span>LOOKING BACK</span><span class="span" id="span">seven days</span></div>
    <div class="track">
      <span class="line"></span>
      <span class="lit" id="lit"></span>
      <span class="ticks" id="ticks" aria-hidden="true"></span>
      <span class="caret" id="caret"></span>
      <input type="range" id="range" min="0" max="6" step="1" value="3"
             aria-label="How far back to look" aria-valuetext="seven days">
    </div>
    <div class="marks" id="marks"></div>
  </div>

  <div class="register" id="register">
    <span class="sweep"></span>
    <div id="rows"></div>
  </div>

  <div class="bar">
    <span class="tally" id="tally"></span>
    <button class="plain" id="markall">mark all</button>
    <button class="plain" id="copy">copy commands</button>
    <div class="mode">
      <span class="mode-label">BACK INTO</span>
      <div class="segs" id="segs" role="group" aria-label="Where the sessions open">
        <button type="button" class="seg" data-layout="tabs" aria-pressed="true"
                title="Every session as a tab of one window">one window</button>
        <button type="button" class="seg" data-layout="windows" aria-pressed="false"
                title="Every session in a window of its own">separate windows</button>
      </div>
    </div>
    <button class="raise" id="raise" disabled>REVIVE</button>
    <div class="said-back" id="word" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const params = new URLSearchParams(location.search);
  const TOKEN = params.get("t") || "";
  if (params.get("still")) document.documentElement.dataset.still = "1";
  const PRESET = params.get("days");

  const STOPS = [
    { days: 0.25, mark: "6h", said: "six hours" },
    { days: 1, mark: "1d", said: "one day" },
    { days: 3, mark: "3d", said: "three days" },
    { days: 7, mark: "7d", said: "seven days" },
    { days: 14, mark: "14d", said: "two weeks" },
    { days: 30, mark: "30d", said: "one month" },
    { days: 90, mark: "90d", said: "three months" },
  ];
  const WORDS = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine",
                 "Ten", "Eleven", "Twelve"];

  const $ = (id) => document.getElementById(id);
  const el = {
    range: $("range"), lit: $("lit"), caret: $("caret"), ticks: $("ticks"), marks: $("marks"),
    span: $("span"), rows: $("rows"), register: $("register"), claim: $("claim"), where: $("where"),
    tally: $("tally"), raise: $("raise"), word: $("word"), tabs: $("tabs"), segs: $("segs"),
  };

  // The same drawing as assets/icon.svg, with the parts the stylesheet animates
  // split out. Its pupils sit back and to the right, so it watches what follows
  // it. The streaks are motion rather than identity and stay out of the icon.
  const FIGURE = `<svg class="rev" viewBox="0 0 58 58" aria-hidden="true">
      <g>
        <path class="streak" d="M41 16h8" stroke-width="3"/>
        <path class="streak" d="M42 26h10" stroke-width="3.4"/>
        <path class="streak" d="M41 34h7" stroke-width="2.6"/>
      </g>
      <path class="body" d="M4 42V21C4 10.5 12 2.5 22 2.5S40 10.5 40 21v21z"/>
      <g><path class="peak" d="M4 41.4h7.2L7.6 50z"/><path class="peak" d="M11.2 41.4h7.2L14.8 48z"/><path class="peak" d="M18.4 41.4h7.2L22 51z"/><path class="peak" d="M25.6 41.4h7.2L29.2 48z"/><path class="peak" d="M32.8 41.4h7.2L36.4 50z"/></g>
      <path class="shade" d="M30 3.6C36 7 40 13.4 40 21v21h-6V21c0-7-1.6-13.2-4-17.4z"/>
      <path class="sheen" d="M14.6 5.2C11 8.6 9 14.2 9 21v12H6V21c0-6.6 3.2-12.8 8.6-15.8z"/>
      <g class="eyes">
        <ellipse class="sclera" cx="15.4" cy="21.5" rx="5.3" ry="6"/>
        <ellipse class="sclera" cx="29.6" cy="21.5" rx="5.3" ry="6"/>
        <circle class="pupil" cx="17.8" cy="22.6" r="2.5"/>
        <circle class="pupil" cx="32" cy="22.6" r="2.5"/>
      </g>
      <ellipse class="mouth" cx="22.4" cy="33.4" rx="2.5" ry="3"/>
    </svg>`;

  // A block cursor with bracket jaws. The hem of the figure it chases is a
  // caret too, so the pair belongs to the same alphabet.
  const HUNTER = `<svg class="pur" viewBox="0 0 52 40" aria-hidden="true">
      <path class="wake" d="M41 13c3.4 3.2 3.4 5.6 0 8.8"/>
      <path class="wake" d="M41 13c3.4 3.2 3.4 5.6 0 8.8"/>
      <g class="jaw up">
        <path d="M10 4h22a4 4 0 0 1 4 4v12H6V8a4 4 0 0 1 4-4z"/>
        <rect class="gloss" x="9.6" y="6.6" width="9" height="2.4" rx="1.2"/>
        <circle class="eye" cx="26.5" cy="12" r="2.5"/>
      </g>
      <g class="jaw lo">
        <path d="M6 20h30v12a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z"/>
        <rect class="gloss" x="9.6" y="30.4" width="6.4" height="2.2" rx="1.1" style="opacity:.14"/>
      </g>
    </svg>`;

  const MOTES = [...Array(7)].map((unused, i) =>
    `<i class="mote" style="left:${96 + i * 27}px;top:${34 + (i % 4) * 15}px;` +
    `animation-delay:${i * 900}ms"></i>`).join("");

  // Every flourish in here is decoration, so all of them defer to the same two
  // conditions: a screenshot in progress, or a reader who asked for less motion.
  // One live query object rather than a new one per call; it keeps reporting the
  // current setting, so a reader who turns motion down mid-session is heard.
  const calm = matchMedia("(prefers-reduced-motion: reduce)");
  const stillness = () => Boolean(document.documentElement.dataset.still) || calm.matches;

  let typed = false;
  let sessions = [];
  let chosen = new Set();
  let agent = "";
  let seq = 0;

  // ── where the sessions land ───────────────────────────────────────────
  const LAYOUTS = ["tabs", "windows"];
  const LAYOUT_KEY = "revenant.layout";
  // Reading storage throws outright in a browser set to block site data, and the
  // app has to open anyway, so a failure here just means the default.
  const kept = (() => {
    try { return localStorage.getItem(LAYOUT_KEY); } catch (e) { return null; }
  })();
  let layout = LAYOUTS.includes(kept) ? kept : "tabs";

  function paintMode() {
    for (const node of el.segs.children) {
      node.setAttribute("aria-pressed", String(node.dataset.layout === layout));
    }
  }
  el.segs.addEventListener("click", (event) => {
    const node = event.target.closest("[data-layout]");
    if (!node || node.dataset.layout === layout) return;
    layout = node.dataset.layout;
    try { localStorage.setItem(LAYOUT_KEY, layout); } catch (e) { /* not worth a word */ }
    paintMode();
    word(layout === "tabs"
      ? "They will come back as tabs of one window."
      : "They will come back in windows of their own.");
  });
  paintMode();

  // ── the run ───────────────────────────────────────────────────────────
  // Crumbs fall where the runner has been, and the shape behind it is close
  // enough to reach each one a moment later.
  const lane = $("lane");
  let generation = 0;

  // Each tab gets its own run. `lead` is whoever is being chased; `meet` replaces
  // the chase entirely with an approach from both ends.
  const RUNS = {
    "claude-code": { lead: "runner", trail: "hunter", warm: false },
    codex: { lead: "hunter", trail: "runner", warm: true },
    all: { meet: true },
  };

  function run(which) {
    if (stillness()) return;
    const width = lane.clientWidth;
    if (width < 260) return;

    // A tab switch mid-run should show the tab you switched to, so the run in
    // flight is abandoned rather than queued behind.
    const mine = ++generation;
    for (const stale of [...lane.children]) stale.remove();

    const plan = RUNS[which] || RUNS["claude-code"];

    const figure = document.createElement("span");
    figure.className = "runner";
    figure.innerHTML = FIGURE;
    const shape = document.createElement("span");
    shape.className = "hunter";
    shape.innerHTML = HUNTER;
    lane.append(figure, shape);

    const bob = (done, phase) => Math.sin(done * 31 + phase) * 1.6;
    const began = performance.now();

    const clear = () => {
      for (const node of [...lane.children]) node.remove();
    };

    if (plan.meet) {
      // They arrive from opposite ends, hold a beat at arm's length, and back off.
      const middle = width / 2;
      const ease = (t) => 1 - Math.pow(1 - t, 3);
      let burst = false;

      const approach = (now) => {
        if (mine !== generation) return;
        const done = Math.min(1, (now - began) / 2900);
        const closing = done < 0.42 ? ease(done / 0.42) : done < 0.66 ? 1 : ease((1 - done) / 0.34);
        const left = -34 + (middle - 46 + 34) * closing;
        const right = width + 34 - (width + 34 - (middle + 10)) * closing;
        figure.style.transform = `translate(${left}px, ${bob(done, 0)}px)`;
        shape.style.transform = `translate(${right}px, ${bob(done, 2.1)}px)`;
        // They turn around at the top of the retreat, so nobody reverses facing
        // the way they came.
        figure.classList.toggle("rightward", done < 0.66);
        shape.classList.toggle("rightward", done >= 0.66);

        if (!burst && done > 0.44) {
          burst = true;
          for (let i = 0; i < 6; i++) {
            const bit = document.createElement("i");
            bit.className = "spark";
            bit.style.left = `${Math.round(middle - 4)}px`;
            bit.style.setProperty("--dx", `${(Math.random() * 26 - 13).toFixed(1)}px`);
            bit.style.setProperty("--dy", `${(Math.random() * 18 - 11).toFixed(1)}px`);
            lane.appendChild(bit);
          }
        }
        if (done < 1) return requestAnimationFrame(approach);
        clear();
      };
      requestAnimationFrame(approach);
      return;
    }

    const lead = plan.lead === "runner" ? figure : shape;
    const trail = plan.lead === "runner" ? shape : figure;
    if (plan.lead === "hunter") figure.classList.add("ahead");

    const crumbs = [];
    const reach = 74;
    const travel = width + 130;
    let last = Infinity;

    function step(now) {
      if (mine !== generation) return;
      const done = Math.min(1, (now - began) / 2400);
      const x = width + 34 - travel * done;
      lead.style.transform = `translate(${x}px, ${bob(done, 0)}px)`;
      trail.style.transform = `translate(${x + reach}px, ${bob(done, 1.7)}px)`;

      if (x < width && x > -12 && x < last - 16) {
        last = x;
        const crumb = document.createElement("i");
        crumb.className = "crumb";
        crumb.style.left = `${Math.round(x + 6)}px`;
        lane.appendChild(crumb);
        crumbs.push(crumb);
      }
      // The oldest crumb lies furthest to the right, so it is always the next one.
      while (crumbs.length && x + reach <= Number.parseFloat(crumbs[0].style.left)) {
        const eaten = crumbs.shift();
        eaten.className = plan.warm ? "crumb gone warm" : "crumb gone";
        setTimeout(() => eaten.remove(), 220);
      }

      if (done < 1) return requestAnimationFrame(step);
      clear();
    }
    requestAnimationFrame(step);
  }

  $("wordmark").addEventListener("click", () => run(agent));

  // On open it should be a surprise rather than furniture, so it waits a few
  // hours between runs of its own accord. The wordmark starts one at any time.
  const RUN_KEY = "revenant.ran";
  const SETTLE = 6 * 60 * 60 * 1000;
  try {
    if (Date.now() - Number(localStorage.getItem(RUN_KEY) || 0) > SETTLE) {
      localStorage.setItem(RUN_KEY, String(Date.now()));
      setTimeout(() => run(agent), 1500);
    }
  } catch (e) { /* storage is off; the wordmark still works */ }

  const api = (path, options) =>
    fetch(path + (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN), options)
      .then((r) => r.json());

  const stop = () => STOPS[Number(el.range.value)];
  const say = (n) => WORDS[n] || String(n);
  const escape = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let wordTimer;
  function word(text, bad) {
    el.word.textContent = text;
    el.word.classList.toggle("bad", Boolean(bad));
    el.word.classList.add("up");
    clearTimeout(wordTimer);
    wordTimer = setTimeout(() => el.word.classList.remove("up"), 5200);
  }

  // ── the ruler ─────────────────────────────────────────────────────────
  // The fraction of the track a stop sits at. The caret, the lit line, the ticks
  // and the labels all come from here, so they cannot drift apart again.
  const where = (i) => (i / (STOPS.length - 1)) * 100;

  el.ticks.innerHTML = STOPS.map((s, i) => `<i style="left:${where(i)}%"></i>`).join("");
  el.marks.innerHTML = STOPS.map((s, i) => {
    // The end labels hang inside the track rather than off its edges.
    const pull = i === 0 ? "0" : i === STOPS.length - 1 ? "-100%" : "-50%";
    return `<button type="button" data-i="${i}" aria-label="Look back ${s.said}"
              style="left:${where(i)}%;transform:translateX(${pull})">${s.mark}</button>`;
  }).join("");
  el.marks.addEventListener("click", (event) => {
    const target = event.target.closest("[data-i]");
    if (!target) return;
    el.range.value = target.dataset.i;
    paintRuler();
    load();
  });

  function paintRuler() {
    const index = Number(el.range.value);
    el.lit.style.width = `${where(index)}%`;
    el.caret.style.left = `${where(index)}%`;
    el.span.textContent = stop().said;
    el.range.setAttribute("aria-valuetext", stop().said);
    for (const node of el.marks.children) {
      node.dataset.on = String(Number(node.dataset.i) === index);
    }
  }

  // Dragging the caret back through time strikes sparks off it. They are spawned
  // on the track rather than the caret itself, which is mid-transition and would
  // carry them along with it.
  const track = el.caret.parentElement;
  let struck = 0;

  function sparks() {
    if (stillness() || performance.now() - struck < 55) return;
    if (track.querySelectorAll(".spark").length > 14) return;
    struck = performance.now();
    for (let i = 0; i < 2; i++) {
      const bit = document.createElement("i");
      bit.className = "spark";
      bit.style.left = el.caret.style.left;
      bit.style.setProperty("--dx", `${(Math.random() * 15 - 5).toFixed(1)}px`);
      bit.style.setProperty("--dy", `${(-9 - Math.random() * 13).toFixed(1)}px`);
      track.appendChild(bit);
      setTimeout(() => bit.remove(), 640);
    }
  }

  el.register.addEventListener("scroll", paintEdge, { passive: true });
  addEventListener("resize", paintEdge);

  let hold;
  el.range.addEventListener("input", () => {
    paintRuler();
    sparks();
    clearTimeout(hold);
    hold = setTimeout(load, 190);
  });

  // ── data ──────────────────────────────────────────────────────────────
  async function load() {
    const mine = ++seq;
    el.register.classList.add("loading");
    let data;
    try {
      data = await api(`/api/sessions?days=${stop().days}${agent ? "&agent=" + agent : ""}`);
    } catch {
      if (mine !== seq) return;
      // Leaving the loading class on would dim the register for good, including
      // every row a later reload paints under it.
      el.register.classList.remove("loading");
      typed = true;
      el.claim.dataset.typing = "false";
      el.claim.textContent = "The local service stopped answering.";
      el.rows.innerHTML = "";
      return;
    }
    if (mine !== seq) return;
    el.register.classList.remove("loading");

    paintTabs(data.agents || [], data.agent);
    if (data.error) {
      el.claim.textContent = "Nothing to read.";
      el.where.textContent = data.error;
      sessions = [];
      chosen.clear();
      paint();
      return;
    }

    el.where.textContent = document.documentElement.dataset.still
      ? "Reading transcripts in ~/.claude"
      : `Reading transcripts in ${data.root}`;

    const all = data.sessions || [];
    sessions = [...all.filter((s) => !s.live), ...all.filter((s) => s.live)];
    chosen = new Set(sessions.filter((s) => !s.live).map((s) => s.sessionId));
    paint();
  }

  function paintTabs(list, current) {
    agent = current || agent;
    if (!list.length) {
      el.tabs.innerHTML = "";
      return;
    }
    el.tabs.innerHTML = list
      .map((a) => `<button type="button" data-key="${escape(a.key)}" aria-current="${a.key === current}"
                     title="${escape(a.note || "")}">${escape(a.label.toUpperCase())}</button>`)
      .join("");
    el.tabs.querySelectorAll("button").forEach((node) => {
      node.addEventListener("click", () => {
        if (node.dataset.key === agent) return;
        agent = node.dataset.key;
        run(agent);
        load();
      });
    });
  }

  // The first claim is typed out under a block cursor. Every later one lands at
  // once, because by then the reader is waiting on an answer rather than a show.
  let typewriter = null;

  function claim(text) {
    clearTimeout(typewriter);
    if (typed || stillness()) {
      el.claim.textContent = text;
      el.claim.dataset.typing = "false";
      typed = true;
      return;
    }
    typed = true;
    el.claim.dataset.typing = "true";
    el.claim.textContent = "";
    let cut = 0;
    (function letter() {
      el.claim.textContent = text.slice(0, ++cut);
      if (cut < text.length) return void (typewriter = setTimeout(letter, 17));
      typewriter = setTimeout(() => { el.claim.dataset.typing = "false"; }, 2200);
    })();
  }

  function paint() {
    const open = sessions.filter((s) => !s.live);
    const held = sessions.length - open.length;

    // Count what can actually be raised: saying "eight outlived their terminals"
    // when all eight are still running reads as a lie.
    if (!sessions.length) {
      claim(`Nothing in the last ${stop().said}.`);
    } else if (!open.length) {
      claim(`${say(held)} session${held === 1 ? " is" : "s are"} still running.`);
    } else {
      claim(`${say(open.length)} session${open.length === 1 ? "" : "s"} outlived ` +
        `${open.length === 1 ? "its terminal" : "their terminals"}.`);
    }

    if (!sessions.length) {
      el.rows.innerHTML = `
        <div class="ghost-rule"></div><div class="ghost-rule"></div><div class="ghost-rule"></div>
        <div class="blank">
          <span class="pale" aria-hidden="true">${FIGURE}</span>
          ${MOTES}
          <p>Every session in this window is still running, or there were none to begin with.</p>
          <small>Drag the caret right to look further back.<br>
                 Nothing here is deleted. Transcripts stay on disk for as long as your agent keeps them.</small>
        </div>`;
    } else {
      const many = new Set(sessions.map((s) => s.agent)).size > 1;
      el.rows.innerHTML = sessions.map((s, i) => row(s, i, many)).join("");
      el.rows.querySelectorAll(".row").forEach((node) => {
        if (node.dataset.held === "true") return;
        node.addEventListener("click", () => toggle(node.dataset.id));
        node.addEventListener("dblclick", () => reveal(node));
        node.addEventListener("keydown", (event) => {
          if (event.key.toLowerCase() === "o") {
            event.preventDefault();
            reveal(node);
          }
        });
      });
    }
    paintTally(open.length, held);
    paintEdge();
  }

  function paintEdge() {
    const box = el.register;
    // Writing on every scroll event would dirty style for the next one's read.
    const more = String(box.scrollTop + box.clientHeight < box.scrollHeight - 2);
    if (box.dataset.more !== more) box.dataset.more = more;
  }

  function reveal(node) {
    api("/api/reveal", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: node.dataset.path }),
    }).then((r) => { if (!r.ok) word(r.message || "That folder is gone.", true); });
  }

  function row(s, index, many) {
    const on = chosen.has(s.sessionId);
    const turns = s.turns == null ? "" : s.turns;
    const who = many
      ? `<span class="who" data-agent="${escape(s.agent)}">${escape((s.agentLabel || "").toUpperCase())}</span>`
      : "";
    const flag = s.live
      ? `<span class="flag">HELD, ${escape((s.liveReason || "").toUpperCase())}</span>`
      : "";
    const said = s.live
      ? ""
      : `<span class="said">${escape(s.lastPrompt || s.firstPrompt || "")}</span>`;
    return `<button class="row enter" type="button" data-id="${escape(s.sessionId)}"
        data-on="${on}" data-held="${Boolean(s.live)}" data-path="${escape(s.cwd || "")}"
        aria-pressed="${on}" ${s.live ? "disabled" : ""}
        title="Click to mark. Double click, or press O, to open the folder."
        style="animation-delay:${Math.min(index * 26, 320)}ms">
      <span class="age">${escape(s.ageLabel || "")}</span>
      <span class="mark"><i></i></span>
      <span class="body">
        <span class="name-line">
          <span class="name">${escape(s.label)}</span>${who}${flag}
        </span>
        <span class="path" title="${escape(s.cwd || "directory unknown")}">${escape(s.cwd || "directory unknown")}</span>
        ${said}
      </span>
      <span class="turns">${turns}</span>
    </button>`;
  }

  function toggle(id) {
    if (chosen.has(id)) chosen.delete(id);
    else chosen.add(id);
    const node = el.rows.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
    if (node) {
      node.dataset.on = String(chosen.has(id));
      node.setAttribute("aria-pressed", node.dataset.on);
    }
    repaintTally();
  }

  function repaintTally() {
    const open = sessions.filter((s) => !s.live).length;
    paintTally(open, sessions.length - open);
  }

  function paintTally(open, held) {
    const n = chosen.size;
    const heldWord = held ? ` ${held} held back.` : "";
    el.tally.innerHTML = open
      ? `<b>${n}</b> of ${open} marked.${heldWord}` +
        ` <span class="hint">Double click a row to open its folder.</span>`
      : (held ? `${held} held back, nothing to raise.` : "Nothing to raise.");
    el.raise.disabled = n === 0;
    el.raise.textContent = n ? `REVIVE ${n}` : "REVIVE";
  }

  // ── actions ───────────────────────────────────────────────────────────
  $("markall").addEventListener("click", () => {
    const open = sessions.filter((s) => !s.live);
    if (chosen.size === open.length) chosen.clear();
    else open.forEach((s) => chosen.add(s.sessionId));
    paint();
  });

  $("copy").addEventListener("click", async () => {
    if (!chosen.size) return word("Mark a session first.");
    const data = await api("/api/commands", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids: [...chosen], days: stop().days, agent }),
    });
    try {
      await navigator.clipboard.writeText(data.text);
    } catch {
      const scratch = document.createElement("textarea");
      scratch.value = data.text;
      document.body.appendChild(scratch);
      scratch.select();
      document.execCommand("copy");
      scratch.remove();
    }
    word(`${data.count} command pair${data.count === 1 ? "" : "s"} on the clipboard.`);
  });

  el.raise.addEventListener("click", async () => {
    if (!chosen.size) return;
    const ids = [...chosen];
    el.raise.dataset.busy = "true";
    el.raise.textContent = "RAISING";
    el.register.classList.add("raising");

    if (!document.documentElement.dataset.still) {
      ids.forEach((id, i) => {
        const node = el.rows.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
        if (!node) return;
        setTimeout(() => {
          const stamp = document.createElement("span");
          stamp.className = "stamp";
          stamp.textContent = "RAISED";
          node.appendChild(stamp);

          const soul = document.createElement("span");
          soul.className = "soul";
          soul.innerHTML = FIGURE;
          node.appendChild(soul);
          setTimeout(() => soul.remove(), 1600);
        }, 120 + i * 90);
      });
    }

    let result;
    try {
      result = await api("/api/revive", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids, days: stop().days, agent, layout }),
      });
    } catch {
      result = { ok: false, message: "The local service did not answer." };
    }

    el.raise.dataset.busy = "false";
    setTimeout(() => el.register.classList.remove("raising"), 900);

    if (result.ok) {
      word(`${result.count} back from the dead. ${result.message || ""}`.trim());
      setTimeout(() => run(agent), 260);
      setTimeout(load, 1600);
    } else {
      el.rows.querySelectorAll(".stamp").forEach((node) => node.remove());
      word(result.message || "Nothing was raised.", true);
      repaintTally();
    }
  });

  // ── window chrome ─────────────────────────────────────────────────────
  const native = () => (window.pywebview && window.pywebview.api) || null;
  $("hide").addEventListener("click", () => {
    const bridge = native();
    if (bridge && bridge.minimize) bridge.minimize();
  });
  $("shut").addEventListener("click", async () => {
    const bridge = native();
    if (bridge && bridge.destroy) return bridge.destroy();
    await api("/api/quit", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    window.close();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") $("shut").click();
    if (event.key === "Enter" && event.target === document.body && !el.raise.disabled) el.raise.click();
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "r") {
      event.preventDefault();
      load();
    }
  });

  if (!params.get("still")) {
    setInterval(() => { api("/api/ping").catch(() => {}); }, 5000);
  }

  if (PRESET !== null) {
    const wanted = Number(PRESET);
    if (Number.isFinite(wanted)) {
      let best = 0;
      STOPS.forEach((s, i) => {
        if (Math.abs(s.days - wanted) < Math.abs(STOPS[best].days - wanted)) best = i;
      });
      el.range.value = best;
    }
  }

  paintRuler();
  load();
})();
</script>
</body>
</html>
