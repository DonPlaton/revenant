name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run the suite
        run: python -m pytest tests -q

  install:
    # The quick start is a claim about someone else's machine, so it gets run on
    # one, both ways in: from a clone, and downloaded the way the one-liner does it.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from the clone
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1
          else
            chmod +x install.sh uninstall.sh
            ./install.sh
          fi

      - name: The launcher runs the app in the clone
        run: python .github/verify-install.py

      - name: Uninstall
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File ./uninstall.ps1
          else
            ./uninstall.sh
          fi

      - name: Nothing is left behind
        run: python .github/verify-install.py --absent

      - name: Package this checkout the way GitHub packages a download
        # $HOME, not $RUNNER_TEMP: on Windows that is a backslash path, and passing
        # it through Git Bash to tar mangles it into D\:\a\\_temp.
        run: |
          rm -rf "$HOME/revenant-serve"
          mkdir -p "$HOME/revenant-serve"
          git archive --format=tar --prefix=revenant-ci/ HEAD | tar -xf - -C "$HOME/revenant-serve"
          cd "$HOME/revenant-serve"
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command "Compress-Archive -Path revenant-ci -DestinationPath src.zip -Force"
          else
            tar -czf src.tar.gz revenant-ci
          fi
          ls -l

      - name: Serve it
        run: |
          python -m http.server 8765 --directory "$HOME/revenant-serve" &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8765/ && break
            sleep 1
          done

      - name: Install the way the one-liner does, with no folder to start from
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            REVENANT_ARCHIVE_URL=http://127.0.0.1:8765/src.zip \
              powershell -NoProfile -ExecutionPolicy Bypass -Command "Get-Content ./install.ps1 -Raw | Invoke-Expression"
          else
            REVENANT_ARCHIVE_URL=http://127.0.0.1:8765/src.tar.gz bash -s < ./install.sh
          fi

      - name: The launcher runs the downloaded copy, not the clone
        run: python .github/verify-install.py --managed

      - name: Uninstall takes the downloaded copy with it
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File ./uninstall.ps1
          else
            ./uninstall.sh
          fi
          python .github/verify-install.py --absent
